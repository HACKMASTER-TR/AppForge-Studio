# Template only: NEVER deploy to an existing production Worker without review.
# Copy/rename explicitly after a private R2 bucket is created. No credentials here.
name = "appforge-packages-staging-readonly"
main = "worker.mjs"
compatibility_date = "2026-10-27"
workers_dev = false

[[r2_buckets]]
binding = "PACKAGES_BUCKET"
bucket_name = "appforge-packages-staging"
preview_bucket_name = "appforge-packages-staging"

[vars]
STAGING_READ_ENABLED = "false"
