name: AppForge Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create project zip
        run: |
          cd web
          zip -r ../project.zip .

      - name: Start AppForge build
        id: create
        env:
          APPFORGE_URL: ${{ secrets.APPFORGE_URL }}
          APPFORGE_TOKEN: ${{ secrets.APPFORGE_TOKEN }}
        run: |
          RESPONSE=$(curl -sS -X POST "$APPFORGE_URL/api/builds" \
            -H "X-AppForge-Key: $APPFORGE_TOKEN" \
            -F 'config={"appName":"CI App","packageName":"com.example.ci","sourceMode":"LOCAL","versionName":"1.0.0","versionCode":1,"buildOutput":"aab","signing":{"mode":"DEBUG"},"firebase":{},"features":{},"workerRequirements":["android-api-37","java-17","gradle"]};type=application/json' \
            -F project=@project.zip)

          BUILD_ID=$(node -e 'const j=JSON.parse(process.argv[1]); console.log(j.buildId)' "$RESPONSE")
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for build
        env:
          APPFORGE_URL: ${{ secrets.APPFORGE_URL }}
          APPFORGE_TOKEN: ${{ secrets.APPFORGE_TOKEN }}
          BUILD_ID: ${{ steps.create.outputs.build_id }}
        run: |
          for i in $(seq 1 120); do
            RESPONSE=$(curl -sS \
              -H "X-AppForge-Key: $APPFORGE_TOKEN" \
              "$APPFORGE_URL/api/builds/$BUILD_ID")

            STATUS=$(node -e 'const j=JSON.parse(process.argv[1]); console.log(j.status)' "$RESPONSE")
            echo "Status: $STATUS"

            if [ "$STATUS" = "success" ]; then
              exit 0
            fi

            if [ "$STATUS" = "failed" ]; then
              echo "$RESPONSE"
              exit 1
            fi

            sleep 10
          done

          echo "Build timeout"
          exit 1
