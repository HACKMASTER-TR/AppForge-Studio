name: AppForge V548 R20 Signed APK Candidate Verification - No Device
on:
  push:
    branches:
      - codex/v548-r20-signed-apk-ci-20261119
permissions:
  contents: read
  actions: read
concurrency:
  group: v548-r20-signed-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated3-signed-candidate:
    if: github.repository == 'HACKMASTER-TR/AppForge-Studio'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      APPFORGE_DEBUG_KEY_ALIAS: appforge-v9r2-isolated
      APPFORGE_DEBUG_STORE_PASSWORD: ${{ secrets.APPFORGE_V9R2_ISOLATED2_KEYSTORE_PASSWORD }}
      APPFORGE_DEBUG_KEY_PASSWORD: ${{ secrets.APPFORGE_V9R2_ISOLATED2_KEYSTORE_PASSWORD }}
    steps:
      - name: Initialize disposable verified Gradle home
        shell: bash
        run: |
          set -euo pipefail
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/v548-r20-verified-gradle" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce exact R19 source, verified gates and reference APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = codex/v548-r20-signed-apk-ci-20261119
          test "$(git rev-parse HEAD^)" = b8021c341d33d5f2b14b1022a9bd6e96cf5d887f
          python3 - <<'PY'
          import subprocess
          base='b8021c341d33d5f2b14b1022a9bd6e96cf5d887f'
          files=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          expected={'.github/workflows/v548-r20-signed-apk-ci.yml',
                    'android-app/app/build.gradle.kts',
                    'android-app/app/src/main/assets/second_brain_snapshot.json'}
          assert files==expected,('R18_CHANGED_FILE_SCOPE_DRIFT',files)
          PY
          git diff --check HEAD^
          for run in 44597901711 44597918318; do
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)" = success
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_sha)" = b8021c341d33d5f2b14b1022a9bd6e96cf5d887f
          done
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44580945753" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44580945753" --jq .head_sha)" = 1b7dad90cbe2e3b06e330f3e41795679f52b85a2
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14558269996" --jq .expired)" = false
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14558269996" --jq .digest)" = sha256:0c2c9295f8843e00c95df4aad876e8ba7bd9e04bf2e5a4123d3f0d83c80fbb3f
          python3 scripts/generate-second-brain-snapshot.py --check
          echo APPFORGE_V548_R20_TRUST_BOUNDARY=PASS
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Require signed R16 AGP candidate provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=HACKMASTER-TR/AppForge-Studio
          test "$(gh api "repos/$repo/actions/runs/44570760969" --jq .conclusion)" = success
          test "$(gh api "repos/$repo/actions/artifacts/14554148259" --jq .expired)" = false
          test "$(gh api "repos/$repo/actions/artifacts/14554148259" --jq .digest)" = sha256:fa745ccdf122f86d77d5b971d2c2db0300db2b77d8d0984ec9628cec67fe85c0
          echo R20_AGP_SEED_PROVENANCE=PASS
      - uses: actions/download-artifact@v4
        with:
          repository: HACKMASTER-TR/AppForge-Studio
          run-id: 44570760969
          name: v547-agp911-gradle931-ci-candidate-7d0994b6582a859c516967fd162fbd4e3d1b054a
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v548-r20-agp-candidate
      - name: Verify 471 pinned AGP files into isolated Gradle cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GRADLE_USER_HOME"
          python3 quality/tools/v547_agp_arm64_candidate_probe.py "$RUNNER_TEMP/v548-r20-agp-candidate" "$GRADLE_USER_HOME/caches"
          echo R20_VERIFIED_AGP_CACHE=PASS
      - name: Confirm offline AGP 9.1.1 plugin resolution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v548-r20-plugin-proof"
          cd "$RUNNER_TEMP/v548-r20-plugin-proof"
          printf '%s\n' 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' 'rootProject.name = "R19OfflinePluginProof"' > settings.gradle.kts
          printf '%s\n' 'plugins { id("com.android.application") version "9.1.1" apply false }' > build.gradle.kts
          gradle --offline help --no-daemon --no-configuration-cache --console=plain
          echo R20_OFFLINE_AGP_RESOLUTION=PASS
      - name: Install pinned Android SDK and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --channel=3 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          test -s "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          test -d "$ANDROID_HOME/cmake/3.22.1"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          echo APPFORGE_V548_R20_TOOLCHAIN=PASS
      - name: Restore and validate original isolated3 debug signer in temporary CI storage
        shell: bash
        env:
          TEST_KEYSTORE_B64: ${{ secrets.APPFORGE_V9R2_ISOLATED2_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$TEST_KEYSTORE_B64" && test -n "$APPFORGE_DEBUG_STORE_PASSWORD"
          umask 077
          KEYFILE="$RUNNER_TEMP/v548-r20-isolated3-signer.p12"
          printf '%s' "$TEST_KEYSTORE_B64" | base64 --decode > "$KEYFILE"
          CERT="$(openssl pkcs12 -in "$KEYFILE" -nokeys -clcerts -passin env:APPFORGE_DEBUG_STORE_PASSWORD | openssl x509 -outform DER | sha256sum | cut -d' ' -f1)"
          test "$CERT" = dd1dbb994df46f9815c08fe14758f60b39d5787be41a1123bbc2579589f73082
          keytool -list -storetype PKCS12 -keystore "$KEYFILE" -storepass:env APPFORGE_DEBUG_STORE_PASSWORD -alias "$APPFORGE_DEBUG_KEY_ALIAS" >/dev/null
          echo "APPFORGE_DEBUG_KEYSTORE_PATH=$KEYFILE" >> "$GITHUB_ENV"
          echo APPFORGE_V548_R20_SIGNER_PIN=PASS
      - uses: actions/download-artifact@v4
        with:
          repository: HACKMASTER-TR/AppForge-Studio
          run-id: 44580945753
          name: AppForge-v547-r18-signed-acceptance-1b7dad90cbe2e3b06e330f3e41795679f52b85a2
          github-token: ${{ github.token }}
          path: reference-v547
      - name: Verify immutable V547 APK, manifest SHA-256, signer and source
        shell: bash
        run: |
          set -euo pipefail
          test "$(find reference-v547 -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1
          (cd reference-v547 && sha256sum -c SHA256SUMS.txt)
          OLD="$(find reference-v547 -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -s "$OLD"
          unzip -tqq "$OLD"
          python3 - <<'PY'
          import json,pathlib
          e=json.loads(pathlib.Path('reference-v547/upgrade-evidence.json').read_text())
          assert e['source_sha']=='1b7dad90cbe2e3b06e330f3e41795679f52b85a2'
          assert e['package']=='com.appforge.studio.v9r2isolated3'
          assert e['version_code']==547
          assert e['version_name']=='5.0.47-isolated3-upgrade'
          assert e['certificate_sha256']=='dd1dbb994df46f9815c08fe14758f60b39d5787be41a1123bbc2579589f73082'
          assert e['update_compatible'] is True
          print('APPFORGE_V548_R20_V547_REFERENCE=PASS')
          PY
      - name: Prepare pinned Kotlin compiler repository
        shell: bash
        run: python3 quality/tools/v9_pinned_kotlin_compiler.py "$RUNNER_TEMP/v548-r20-kotlin-maven"
      - name: Build and test V547 debug candidate with original isolated3 package identity
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android-app :app:testDebugUnitTest :app:assembleDebug \
            -PappforgeV9R2Isolated3Acceptance=true \
            -PappforgeV9R2Isolated3UpgradeV548=true \
            -PappforgePinnedKotlinCompilerRepo="$RUNNER_TEMP/v548-r20-kotlin-maven" \
            -PappforgeCIMavenGcs=true \
            --no-daemon --max-workers=2 --no-configuration-cache --console=plain --stacktrace
          echo APPFORGE_V548_R20_ANDROID_APK_BUILD=PASS
      - name: Verify signed V548 in-place update against exact V547 candidate
        shell: bash
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          OLD="$(find reference-v547 -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -s "$APK" && test -s "$OLD"
          mkdir -p r20-artifacts
          python3 - <<'PY'
          import hashlib,json,pathlib
          old=next(pathlib.Path('reference-v547').glob('*.apk'))
          prev=json.loads(pathlib.Path('reference-v547/upgrade-evidence.json').read_text())
          record=json.loads(pathlib.Path('quality/fixtures/appforge-v9r2isolated3-v545-reference.json').read_text())
          with old.open('rb') as f: old_sha=hashlib.file_digest(f,'sha256').hexdigest()
          assert old_sha==prev['apk_sha256']
          assert record['package']==prev['package']
          assert record['certificate_sha256']==prev['certificate_sha256']
          record['version_code']=547
          record['version_name']='5.0.47-isolated3-upgrade'
          record['apk_sha256']=old_sha
          record['source_sha']=prev['source_sha']
          record['source_run_id']=44580945753
          record['source_artifact_id']=14558269996
          record['upgrade_version_code']=548
          pathlib.Path('r20-artifacts/expected-reference-v548.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
          python3 quality/tools/verify_apk_upgrade.py \
            --reference r20-artifacts/expected-reference-v548.json \
            --old-apk "$OLD" --new-apk "$APK" \
            --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2" \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --source-sha "$GITHUB_SHA" \
            --output r20-artifacts/upgrade-evidence.json
          python3 - <<'PY'
          import json,pathlib,xml.etree.ElementTree as ET
          e=json.loads(pathlib.Path('r20-artifacts/upgrade-evidence.json').read_text())
          assert e['package']=='com.appforge.studio.v9r2isolated3'
          assert e['version_code']==548
          assert e['version_name']=='5.0.48-isolated3-upgrade'
          assert e['certificate_sha256']=='dd1dbb994df46f9815c08fe14758f60b39d5787be41a1123bbc2579589f73082'
          assert e['update_compatible'] is True
          assert e['physical_device']=='NOT_RUN'
          files=list(pathlib.Path('android-app/app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          assert files,'UNIT_TEST_REPORT_MISSING'
          roots=[ET.parse(f).getroot() for f in files]
          counts={k:sum(int(r.get(k,0)) for r in roots) for k in ('tests','failures','errors','skipped')}
          assert counts['tests']>0 and counts['failures']==counts['errors']==counts['skipped']==0,counts
          pathlib.Path('r20-artifacts/unit-tests.json').write_text(json.dumps(counts,indent=2)+'\n')
          pathlib.Path('r20-artifacts/physical-acceptance.json').write_text(json.dumps({
            'adb':'NOT_USED','android_install':'NOT_STARTED','device_data':'UNCHANGED',
            'physical_device':'NOT_RUN','r2':'UNTOUCHED','cloudflare':'UNCHANGED',
            'release':'NOT_PUBLISHED','v547_device_installed_state':'NOT_VERIFIED_BY_CI'
          },indent=2)+'\n')
          print('APPFORGE_V548_R20_METADATA_AND_UNIT_TESTS=PASS')
          PY
          cp "$APK" "r20-artifacts/AppForgeStudio-V548-R20-${GITHUB_SHA:0:12}.apk"
          (cd r20-artifacts && sha256sum *.apk > SHA256SUMS.txt)
          echo APPFORGE_V548_R20_SIGNED_CANDIDATE=VERIFIED_NOT_INSTALLED
      - name: Upload verified APK and evidence, never signing key
        uses: actions/upload-artifact@v4
        with:
          name: AppForge-v548-r20-signed-acceptance-${{ github.sha }}
          path: r20-artifacts/
          retention-days: 14
          if-no-files-found: error
      - name: Delete transient signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/v548-r20-isolated3-signer.p12"
