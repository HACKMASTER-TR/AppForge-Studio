name: AppForge Publisher Auth Staging Read-Only Preflight

on:
  push:
    branches:
      - audit/windows-publisher-server-auth-preflight-20261002
    paths:
      - .github/workflows/windows-publisher-server-auth-staging-preflight.yml

permissions:
  contents: read

jobs:
  readonly-preflight:
    name: Publisher Auth Read-Only Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact audit source
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Verify audit branch and source parent
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_HEAD="53895ff5cabc33cf822754fbd55036dae3ae4758"
          AUDIT_FILE=".github/workflows/windows-publisher-server-auth-staging-preflight.yml"

          test "$GITHUB_REF" = \
            "refs/heads/audit/windows-publisher-server-auth-preflight-20261002"

          test "$(git rev-parse HEAD^)" = "$SOURCE_HEAD"

          test "$(git diff --name-only HEAD^ HEAD)" = "$AUDIT_FILE"

          test -f cloudflare/control-plane/src/index.mjs
          test -f .github/scripts/pro_cloudflare_auth_preflight.py

          echo "AUDIT_SOURCE_PARENT=PASS"
          echo "AUDIT_SCOPE=PASS"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Cloudflare target read-only preflight
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail

          python3 \
            .github/scripts/pro_cloudflare_auth_preflight.py

          echo "CLOUDFLARE_TARGET_READ_ONLY=PASS"

      - name: Bundle proposed Worker without deployment
        shell: bash
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          set +x
          umask 077

          test -n "$CLOUDFLARE_D1_DATABASE_ID"

          CONFIG="$(
            mktemp \
              "$PWD/cloudflare/control-plane/.publisher-preflight-XXXXXXXX.toml"
          )"

          OUTDIR="$(
            mktemp -d \
              "$RUNNER_TEMP/appforge-publisher-preflight-XXXXXXXX"
          )"

          trap 'rm -f "$CONFIG"; rm -rf "$OUTDIR"' EXIT

          cat > "$CONFIG" <<TOML
          name = "appforge-control-plane"
          main = "src/index.mjs"
          compatibility_date = "2026-09-19"
          workers_dev = true
          preview_urls = false
          keep_vars = true

          [[d1_databases]]
          binding = "DB"
          database_name = "appforge-control-plane-db"
          database_id = "$CLOUDFLARE_D1_DATABASE_ID"
          migrations_dir = "migrations"
          TOML

          (
            cd cloudflare/control-plane

            npx --yes wrangler@4 deploy \
              --config "$CONFIG" \
              --dry-run \
              --keep-vars \
              --outdir "$OUTDIR"
          )

          python3 - "$OUTDIR" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])

          bundles = [
              p for p in root.rglob("*.js")
              if p.is_file()
          ]

          if not bundles:
              raise SystemExit(
                  "STOP: WORKER_BUNDLE_MISSING"
              )

          combined = "\n".join(
              p.read_text(
                  encoding="utf-8",
                  errors="replace"
              )
              for p in bundles
          )

          required = [
              "/api/admin/windows-signing/grant",
              "/api/admin/windows-signing/consume",
              "windows_signing_grant_issued",
              "windows_signing_grant_consumed",
              "signing_grant_replay",
              "/api/pro/code/status",
          ]

          missing = [
              item
              for item in required
              if item not in combined
          ]

          if missing:
              print(
                  "MISSING="
                  + ",".join(missing)
              )
              raise SystemExit(
                  "STOP: REQUIRED_BUNDLE_MARKER_MISSING"
              )

          print(
              "BUNDLED_JS_FILES="
              + str(len(bundles))
          )
          print(
              "PUBLISHER_SIGNING_ROUTES_IN_BUNDLE=PASS"
          )
          print(
              "REPLAY_PROTECTION_IN_BUNDLE=PASS"
          )
          print(
              "EXISTING_PRO_ROUTE_IN_BUNDLE=PASS"
          )
          PY

          echo "WRANGLER_DRY_RUN=PASS"
          echo "WORKER_DEPLOY=NOT_STARTED"
          echo "MIGRATIONS_APPLY=NOT_STARTED"

      - name: Observe currently deployed staging routes read-only
        shell: bash
        run: |
          set -euo pipefail
          set +x

          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request

          BASE = (
              "https://appforge-control-plane."
              "28550040284a.workers.dev"
          )

          class NoRedirect(
              urllib.request.HTTPRedirectHandler
          ):
              def redirect_request(
                  self,
                  *args,
                  **kwargs
              ):
                  return None

          opener = urllib.request.build_opener(
              NoRedirect
          )

          def get(path):
              req = urllib.request.Request(
                  BASE + path,
                  method="GET",
                  headers={
                      "Accept":
                          "application/json",
                      "User-Agent":
                          "AppForge-Publisher-Preflight/1.0",
                  },
              )

              try:
                  with opener.open(
                      req,
                      timeout=20
                  ) as response:
                      status = response.status
                      raw = response.read(
                          1024 * 1024
                      )
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  raw = exc.read(
                      1024 * 1024
                  )

              try:
                  payload = json.loads(raw)
              except Exception:
                  raise SystemExit(
                      "STOP: LIVE_RESPONSE_NOT_JSON"
                  )

              if not isinstance(
                  payload,
                  dict
              ):
                  raise SystemExit(
                      "STOP: LIVE_RESPONSE_SHAPE"
                  )

              return status, payload

          status, payload = get(
              "/health"
          )

          if (
              status != 200
              or payload.get("ok") is not True
              or payload.get("database")
                  != "reachable"
          ):
              raise SystemExit(
                  "STOP: LIVE_HEALTH_FAILED"
              )

          print(
              "LIVE_STAGING_HEALTH=PASS"
          )
          print(
              "LIVE_D1_REACHABILITY=PASS"
          )

          for route in (
              "/api/admin/windows-signing/grant",
              "/api/admin/windows-signing/consume",
          ):
              status, payload = get(route)

              if status == 404:
                  state = "NOT_DEPLOYED"
              elif (
                  status == 405
                  and payload.get("error")
                      == "method_not_allowed"
              ):
                  state = "ALREADY_PRESENT"
              else:
                  print(
                      "ROUTE="
                      + route
                  )
                  print(
                      "HTTP_STATUS="
                      + str(status)
                  )
                  raise SystemExit(
                      "STOP: UNEXPECTED_LIVE_SIGNING_ROUTE_STATE"
                  )

              print(
                  route
                  + "="
                  + state
              )

          print(
              "LIVE_CHECK_METHOD=GET_ONLY"
          )
          print(
              "LIVE_DATABASE_WRITES=NONE"
          )
          print(
              "LIVE_DEPLOY_ACTION=NONE"
          )
          PY

      - name: Final read-only boundary
        shell: bash
        run: |
          set -euo pipefail

          test "$(
            find cloudflare/control-plane/migrations \
              -maxdepth 1 \
              -type f \
              -name '*.sql' |
            wc -l |
            tr -d ' '
          )" = "5"

          echo "D1_MIGRATION_COUNT_UNCHANGED=PASS"
          echo "DATABASE_WRITES=NONE"
          echo "WORKER_DEPLOY=NOT_STARTED"
          echo "MIGRATIONS_APPLY=NOT_STARTED"
          echo "PLAY_PRODUCTION=UNTOUCHED"
          echo "CLOUDFLARE_STAGING_READONLY_PREFLIGHT=PASS"
