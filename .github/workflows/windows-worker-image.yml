name: Build AppForge Windows Worker Image

on:
  push:
    branches:
      - main
    paths:
      - "build-service/Dockerfile.windows-worker"
      - "build-service/package.json"
      - "build-service/package-lock.json"
      - "build-service/instrument.mjs"
      - "build-service/windows-worker.js"
      - "build-service/src/**"
      - "build-service/sql/**"
      - ".github/workflows/windows-worker-image.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: appforge-windows-worker-image
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/hackmaster-tr/appforge-windows-worker

jobs:
  build-windows-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: ./build-service
        run: npm install

      - name: Run full regression suite
        working-directory: ./build-service
        run: npm test

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Windows Worker
        uses: docker/build-push-action@v7
        with:
          context: ./build-service
          file: ./build-service/Dockerfile.windows-worker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
