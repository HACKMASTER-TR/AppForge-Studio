name: AppForge Play Internal App Sharing

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type INTERNAL_SHARE to upload an AAB only to Internal App Sharing"
        required: true
        type: string

      integrity_acceptance:
        description: "Build isolated Play Integrity physical acceptance harness"
        required: true
        default: false
        type: boolean

      integrity_staging_base_url:
        description: "Exact appforge-integrity-staging workers.dev URL"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  APPFORGE_GCP_PROJECT_ID: "appforge-18a5a"
  APPFORGE_PLAY_WIF_PROVIDER: "projects/564043752274/locations/global/workloadIdentityPools/appforge-github/providers/appforge-github-oidc"
  APPFORGE_PLAY_SERVICE_ACCOUNT: "appforge-play-publisher@appforge-18a5a.iam.gserviceaccount.com"

jobs:
  internal-share:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Explicit Internal App Sharing gate
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          INTEGRITY_ACCEPTANCE: ${{ inputs.integrity_acceptance }}
          INTEGRITY_STAGING_BASE_URL: ${{ inputs.integrity_staging_base_url }}
        run: |
          set -euo pipefail

          test "$CONFIRM" = "INTERNAL_SHARE"

          if test "$INTEGRITY_ACCEPTANCE" = "true"; then
            python3 - "$INTEGRITY_STAGING_BASE_URL" <<'PYURL'
          import re
          import sys

          value = sys.argv[1].strip()

          pattern = re.compile(
              r"^https://"
              r"appforge-integrity-staging"
              r"\.[A-Za-z0-9.-]+"
              r"\.workers\.dev$"
          )

          if not pattern.fullmatch(value):
              raise SystemExit(
                  "INTEGRITY_ACCEPTANCE_URL_GUARD=FAIL"
              )

          print(
              "INTEGRITY_ACCEPTANCE_URL_GUARD=PASS"
          )
          PYURL

            echo "INTEGRITY_ACCEPTANCE_BUILD=ENABLED"
          else
            echo "INTEGRITY_ACCEPTANCE_BUILD=DISABLED"
          fi

          echo "INTERNAL_APP_SHARING_GATE=PASS"
          echo "PLAY_PRODUCTION_MUTATION=NONE"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Install Android native toolchain
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(
            find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              | sort -V \
              | tail -n 1
          )"

          test -x "$SDKMANAGER"

          "$SDKMANAGER" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

          echo "ANDROID_NATIVE_TOOLCHAIN=PASS"

      - name: Restore release upload key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.APPFORGE_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_B64"

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode \
            > "$RUNNER_TEMP/appforge-release.jks"

          chmod 600 \
            "$RUNNER_TEMP/appforge-release.jks"

          test -s \
            "$RUNNER_TEMP/appforge-release.jks"

      - name: Prepare Play manifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="android-app/app/src/main/AndroidManifest.xml"

          sed -i \
            '/android.permission.REQUEST_INSTALL_PACKAGES/d' \
            "$MANIFEST"

          ! grep -Fq \
            'android.permission.REQUEST_INSTALL_PACKAGES' \
            "$MANIFEST"

          echo "PLAY_MANIFEST=PASS"

      - name: Build signed Internal Sharing AAB
        env:
          APPFORGE_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/appforge-release.jks
          APPFORGE_RELEASE_STORE_PASSWORD: ${{ secrets.APPFORGE_RELEASE_STORE_PASSWORD }}
          APPFORGE_RELEASE_KEY_ALIAS: appforge-release
          APPFORGE_RELEASE_KEY_PASSWORD: ${{ secrets.APPFORGE_RELEASE_KEY_PASSWORD }}
          APPFORGE_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.APPFORGE_GITHUB_OAUTH_CLIENT_ID }}
          INTEGRITY_ACCEPTANCE: ${{ inputs.integrity_acceptance }}
          INTEGRITY_STAGING_BASE_URL: ${{ inputs.integrity_staging_base_url }}
        run: |
          set -euo pipefail

          EXTRA_GRADLE_ARGS=()

          if test "$INTEGRITY_ACCEPTANCE" = "true"; then
            EXTRA_GRADLE_ARGS+=(
              "-PappforgePlayIntegrityAcceptance=true"
              "-PappforgePlayIntegrityAcceptanceBaseUrl=$INTEGRITY_STAGING_BASE_URL"
            )
          fi

          gradle \
            -p android-app \
            :app:testDebugUnitTest \
            :app:bundleRelease \
            "${EXTRA_GRADLE_ARGS[@]}" \
            --stacktrace

          if test "$INTEGRITY_ACCEPTANCE" = "true"; then
            echo "INTEGRITY_ACCEPTANCE_AAB=PASS"
          fi

          echo "INTERNAL_SHARE_AAB_BUILD=PASS"

      - name: Authenticate to Android Publisher API
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.APPFORGE_GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.APPFORGE_PLAY_WIF_PROVIDER }}
          service_account: ${{ env.APPFORGE_PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Upload bundle to Internal App Sharing
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: |
          set -euo pipefail

          test -n "$ACCESS_TOKEN"

          AAB="$(
            find \
              android-app/app/build/outputs/bundle/release \
              -maxdepth 1 \
              -type f \
              -name '*.aab' \
              -print \
              -quit
          )"

          test -n "$AAB"
          test -s "$AAB"

          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            --header "Content-Type: application/octet-stream" \
            --data-binary "@$AAB" \
            "https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/internalappsharing/com.appforge.studio/artifacts/bundle?uploadType=media" \
            > internal-app-sharing.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path(
                  "internal-app-sharing.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          for key in (
              "downloadUrl",
              "certificateFingerprint",
              "sha256",
          ):
              if not data.get(key):
                  raise SystemExit(
                      f"INTERNAL_SHARE_RESPONSE_{key}=FAIL"
                  )

          print(
              "INTERNAL_APP_SHARING_UPLOAD=PASS"
          )
          print(
              "INTERNAL_SHARE_SHA256="
              + data["sha256"]
          )
          print(
              "INTERNAL_SHARE_CERT="
              + data["certificateFingerprint"]
          )
          print(
              "INTERNAL_SHARE_URL="
              + data["downloadUrl"]
          )
          PY

          echo "PLAY_PRODUCTION=UNTOUCHED"

      - name: Preserve Internal Sharing metadata
        uses: actions/upload-artifact@v7
        with:
          name: AppForge-Internal-App-Sharing
          path: internal-app-sharing.json
          retention-days: 7
