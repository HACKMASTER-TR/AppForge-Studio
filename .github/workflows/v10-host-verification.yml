name: V10 host compilation verification

on:
  workflow_dispatch:
  push:
    branches:
      - feat/v10-oss-unified-20261028
    tags-ignore:
      - '**'

permissions:
  contents: read

jobs:
  compile:
    if: github.ref == 'refs/heads/feat/v10-oss-unified-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: '9.3.1'
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22.22.0'
      - name: Verify host and install project pinned SDK packages
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "ndk;28.2.13676358" "cmake;3.22.1"
          test -s "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -s "$ANDROID_HOME/platforms/android-37/android.jar"
          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          test -d "$ANDROID_HOME/cmake/3.22.1"
      - name: Run Android unit tests and compile without packaging
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android-app :app:testDebugUnitTest :app:compileDebugKotlin :app:externalNativeBuildDebug --no-daemon --stacktrace
      - name: Verify Hermes bytecode on Linux for both authored examples
        shell: bash
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          node --version
          for example in rust-expo-jsi rust-expo-turbo; do
            fixture="$RUNNER_TEMP/$example"
            cp -R "examples/$example" "$fixture"
            (
              cd "$fixture"
              npm ci --no-audit --no-fund
              npx --no-install expo config --type public
              npx --no-install expo prebuild --platform android --no-install
              npx --no-install expo export --platform android --max-workers 2
              test -n "$(find dist -name '*.hbc' -print -quit)"
            )
          done
  python-extension:
    if: github.ref == 'refs/heads/feat/v10-oss-unified-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - name: Install exact Rust host toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
          test "$(rustc --version | cut -d ' ' -f 2)" = 1.85.1
          python3 -c 'import sys; assert sys.version_info[:3] == (3, 12, 12)'
      - name: Build and import shipped PyO3 with pinned compatible hosts
        shell: bash
        run: bash scripts/v10/pyo3-host-acceptance.sh shipped
      - name: Test isolated PyO3 candidate without changing shipped pins
        shell: bash
        env:
          PYO3_EXPORT_LOCK: '1'
        run: bash scripts/v10/pyo3-host-acceptance.sh
  windows-native:
    if: github.ref == 'refs/heads/feat/v10-oss-unified-20261028'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22.22.0'
      - name: Validate Windows packaging prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $IsWindows -or [Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'X64') { throw 'Windows x64 required' }
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw 'PowerShell 7 required' }
          foreach ($tool in @('node', 'npm', 'tar.exe')) { Get-Command $tool -ErrorAction Stop | Out-Null }
          if ((node --version) -ne 'v22.22.0') { throw 'Unexpected Node version' }
          if (-not (Test-Path $env:RUNNER_TEMP -PathType Container)) { throw 'Runner temp missing' }
          npm ci --prefix windows-host --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          Push-Location windows-host
          try {
            npx --no-install install-electron --no
            if ($LASTEXITCODE -ne 0) { throw 'Electron binary installation failed' }
          } finally {
            Pop-Location
          }
          node -e "const fs=require('fs'); for(const p of ['windows-host/node_modules/electron/dist/electron.exe','windows-host/node_modules/.bin/electron-builder.cmd']) { if(!fs.statSync(p).isFile()) throw Error(p); }"
          if ($LASTEXITCODE -ne 0) { throw 'Packaging tools missing' }
      - name: Windows Node tests (no native acceptance claim)
        shell: pwsh
        run: |
          npm test --prefix windows-host
          if ($LASTEXITCODE -ne 0) { throw 'Node tests failed' }
      - name: Parse acceptance script before execution
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd 'scripts/v10/windows-host-acceptance.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Package unsigned test EXE and verify native launch
        shell: pwsh
        run: ./scripts/v10/windows-host-acceptance.ps1
