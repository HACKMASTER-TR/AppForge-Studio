name: AppForge R57TU Temporary Snapshot Export (NO BUILD)

on:
  push:
    branches:
      - codex/r57tu-selective-main-20261126
    paths:
      - .github/workflows/r57tu-snapshot-export-temporary.yml

permissions:
  contents: read

jobs:
  regenerate-proposal-snapshot:
    if: github.repository == 'HACKMASTER-TR/AppForge-Studio'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generate original target-commit snapshot in a separate read-only Git worktree
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = codex/r57tu-selective-main-20261126
          BASE=6f05c192170a31a6934c31ebd4b56b98378e2bea
          git cat-file -e "$BASE^{commit}"
          git worktree add --detach "$RUNNER_TEMP/r57tu-snapshot-source" "$BASE"
          cd "$RUNNER_TEMP/r57tu-snapshot-source"
          python3 scripts/generate-second-brain-snapshot.py
          python3 scripts/generate-second-brain-snapshot.py --check
          echo R57TU_SNAPSHOT_BEGIN
          cat android-app/app/src/main/assets/second_brain_snapshot.json
          echo R57TU_SNAPSHOT_END
          echo R57TU_GENERATOR=PASS_TARGET_COMMIT_NO_TEMP_WORKFLOW
