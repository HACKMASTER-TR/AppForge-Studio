name: AppForge Studio Windows Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop-app/**"
      - "build-service/public/studio/**"
      - ".github/workflows/windows-studio-release.yml"

permissions:
  contents: write

concurrency:
  group: appforge-studio-windows-release
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install desktop dependencies
        working-directory: desktop-app
        run: npm ci

      - name: Package Windows Setup and portable EXE
        working-directory: desktop-app
        run: npm run package:win

      - name: Prepare latest Windows assets
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop-app/dist -Filter "AppForgeStudio-Setup-*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          $portable = Get-ChildItem desktop-app/dist -Filter "AppForgeStudio-Windows-*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($null -eq $setup -or $setup.Length -le 0) {
            throw "Windows Setup EXE not found."
          }
          if ($null -eq $portable -or $portable.Length -le 0) {
            throw "Windows portable EXE not found."
          }

          Copy-Item $setup.FullName AppForgeStudio-Setup-latest.exe
          Copy-Item $setup.FullName AppForgeStudio-latest.exe
          Copy-Item $portable.FullName AppForgeStudio-Portable-latest.exe

          Get-FileHash AppForgeStudio-Setup-latest.exe -Algorithm SHA256
          Get-FileHash AppForgeStudio-latest.exe -Algorithm SHA256
          Get-FileHash AppForgeStudio-Portable-latest.exe -Algorithm SHA256

      - name: Publish latest Windows release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Use AppForgeStudio-Setup-latest.exe for normal Windows installation, Start Menu/taskbar shortcuts, and persistent sessions. AppForgeStudio-Portable-latest.exe is optional."
          if gh release view appforge-studio-windows-latest >/dev/null 2>&1; then
            gh release upload appforge-studio-windows-latest \
              AppForgeStudio-Setup-latest.exe \
              AppForgeStudio-latest.exe \
              AppForgeStudio-Portable-latest.exe \
              --clobber
            gh release edit appforge-studio-windows-latest \
              --title "AppForge Studio Windows Latest" \
              --notes "$NOTES"
          else
            gh release create appforge-studio-windows-latest \
              AppForgeStudio-Setup-latest.exe \
              AppForgeStudio-latest.exe \
              AppForgeStudio-Portable-latest.exe \
              --title "AppForge Studio Windows Latest" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA"
          fi