name: AppForge V9 Isolated3 In-place Upgrade
on:
  push:
    branches: ["codex/v9r2-inplace-upgrade-*"]
permissions:
  contents: read
  actions: read
concurrency:
  group: isolated3-upgrade-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'HACKMASTER-TR/AppForge-Studio'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      APPFORGE_DEBUG_KEY_ALIAS: appforge-v9r2-isolated
      APPFORGE_DEBUG_STORE_PASSWORD: ${{ secrets.APPFORGE_V9R2_ISOLATED2_KEYSTORE_PASSWORD }}
      APPFORGE_DEBUG_KEY_PASSWORD: ${{ secrets.APPFORGE_V9R2_ISOLATED2_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Preserve original runtime fixes and production boundaries
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 404e0edb404fbf4826b48f6a7d7007b40508568a HEAD
          test -z "$(git diff --name-only 404e0edb404fbf4826b48f6a7d7007b40508568a HEAD -- cloudflare .github/workflows/android-play-release.yml android-app/app/src/main/java/com/appforge/studio/security/V9ReleaseSignatureVerifier.java)"
          # Original source and production trust boundaries remain immutable.
          # The exact reviewed Expo and CMake host revisions are pinned by Git blob ID,
          # not permitted as an unrestricted path exception.
          test -z "$(git diff --name-only 404e0edb404fbf4826b48f6a7d7007b40508568a HEAD -- android-app/app/src/main/assets/device-build/install-rust-prerequisites.sh)"
          git merge-base --is-ancestor bf934eb4650550f9a6349dee965f4416977bdc77 HEAD
          test "$(git rev-parse HEAD:android-app/app/src/main/assets/device-build/install-toolchain.sh)" = 01d07c8330f304957f10b43d2cd10fed24a8ca52
          test "$(git rev-parse HEAD:android-app/app/src/main/assets/device-build/install-ndk-host-isolated-v7.sh)" = fab4dd5beb503d6e713f45035cb460c1a062bee3
          test "$GITHUB_REF_NAME" != main
      - name: Install pinned Android toolchain
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          "$SDKMANAGER" --channel=3 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi
      - name: Restore the original isolated3 signer without exporting it
        env:
          TEST_KEYSTORE_B64: ${{ secrets.APPFORGE_V9R2_ISOLATED2_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$TEST_KEYSTORE_B64"
          test -n "$APPFORGE_DEBUG_STORE_PASSWORD"
          umask 077
          KEYFILE="$RUNNER_TEMP/isolated3-upgrade-signing.p12"
          printf '%s' "$TEST_KEYSTORE_B64" | base64 -d > "$KEYFILE"
          CERT=$(openssl pkcs12 -in "$KEYFILE" -nokeys -clcerts -passin env:APPFORGE_DEBUG_STORE_PASSWORD | openssl x509 -outform DER | sha256sum | cut -d' ' -f1)
          test "$CERT" = dd1dbb994df46f9815c08fe14758f60b39d5787be41a1123bbc2579589f73082
          keytool -list -storetype PKCS12 -keystore "$KEYFILE" -storepass:env APPFORGE_DEBUG_STORE_PASSWORD -alias "$APPFORGE_DEBUG_KEY_ALIAS" >/dev/null
          echo "APPFORGE_DEBUG_KEYSTORE_PATH=$KEYFILE" >> "$GITHUB_ENV"
      - name: Download exact signed V540 APK from verified successful CI
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44285015575
          name: AppForge-v9r2isolated3-upgrade-366de04d35c107eebc38e5e95f36e1765cda38ba
          path: reference-apk
      - name: Verify pinned v540 APK reference digest
        run: |
          set -euo pipefail
          echo "d702b8c3a069f0151e541dc478d76f5c1e49d3ee10fcc1014eade36172aa13c3  reference-apk/AppForgeStudio-v9r2isolated3-upgrade.apk" | sha256sum -c -
          unzip -tqq reference-apk/AppForgeStudio-v9r2isolated3-upgrade.apk
          python3 - <<'PYTHON'
          import json,pathlib
          reference=json.loads(pathlib.Path('quality/fixtures/appforge-v9r2isolated3-v540-reference.json').read_text())
          assert reference['apk_sha256']=='d702b8c3a069f0151e541dc478d76f5c1e49d3ee10fcc1014eade36172aa13c3'
          assert reference['version_code']==540 and reference['upgrade_version_code']==541
          assert reference['certificate_sha256']=='dd1dbb994df46f9815c08fe14758f60b39d5787be41a1123bbc2579589f73082'
          PYTHON
      - name: Run V9 security tests without skips
        run: |
          set -euo pipefail
          command -v gpgv
          python3 -B -m unittest discover -s quality/tests -p 'test_v9_*.py' -v > /tmp/upgrade-v9-security.log 2>&1 || { tail -120 /tmp/upgrade-v9-security.log; exit 1; }
          if grep -Eq 'skipped=|\.\.\. skipped ' /tmp/upgrade-v9-security.log; then exit 1; fi
          tail -5 /tmp/upgrade-v9-security.log
      - name: Verify upgrade guard and Termux driver regressions
        run: |
          python3 -m unittest discover -s quality/tests -p test_apk_inplace_upgrade.py -v
          python3 -m unittest discover -s quality/tests -p test_storage_release_manifest.py -v
          python3 -m unittest discover -s quality/tests -p test_termux_github_apk.py -v
      - name: Prepare pinned Kotlin compiler
        run: python3 quality/tools/v9_pinned_kotlin_compiler.py "$RUNNER_TEMP/appforge-pinned-kotlin-maven"
      - name: Test and build the original package with a higher version
        run: |
          gradle -p android-app :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest \
            -PappforgeV9R2Isolated3Acceptance=true -PappforgeV9R2Isolated3Upgrade=true \
            -PappforgePinnedKotlinCompilerRepo="$RUNNER_TEMP/appforge-pinned-kotlin-maven" \
            --no-daemon --max-workers=2 --no-configuration-cache --console=plain
      - name: Compare package certificate SDK and version against the installed reference
        run: |
          set -euo pipefail
          mkdir -p upgrade-artifacts
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          OLD=reference-apk/AppForgeStudio-v9r2isolated3-upgrade.apk
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          python3 quality/tools/verify_apk_upgrade.py --reference quality/fixtures/appforge-v9r2isolated3-v540-reference.json --old-apk "$OLD" --new-apk "$APK" \
            --aapt2 "$AAPT" --apksigner "$SIGNER" --source-sha "$GITHUB_SHA" \
            --output upgrade-artifacts/upgrade-evidence.json
          python3 - <<'PYTHON'
          import json, pathlib, xml.etree.ElementTree as E
          files=list(pathlib.Path('android-app/app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          assert files, 'Actual unit XML required'
          results=[E.parse(file).getroot() for file in files]
          counts={key:sum(int(item.get(key,0)) for item in results) for key in ('tests','failures','errors','skipped')}
          assert counts['tests']>0 and all(counts[key]==0 for key in ('failures','errors','skipped')),counts
          pathlib.Path('upgrade-artifacts/unit-tests.json').write_text(json.dumps(counts,indent=2))
          PYTHON
          cp "$APK" upgrade-artifacts/AppForgeStudio-v9r2isolated3-upgrade.apk
          (cd upgrade-artifacts && sha256sum *.apk > SHA256SUMS.txt)
          python3 quality/tools/storage_release_manifest.py --evidence upgrade-artifacts/upgrade-evidence.json --apk upgrade-artifacts/AppForgeStudio-v9r2isolated3-upgrade.apk --output "upgrade-artifacts/release-manifest-$GITHUB_SHA.json"
      - name: Record V541 no-ADB and pending physical device acceptance
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json,os,pathlib
          root=pathlib.Path('upgrade-artifacts')
          proof=json.loads((root/'upgrade-evidence.json').read_text())
          manifest=json.loads((root/('release-manifest-'+os.environ['GITHUB_SHA']+'.json')).read_text())
          assert proof['version_code']==541 and proof['update_compatible'] is True
          assert proof['physical_device']=='NOT_RUN' and manifest['physical_device']=='NOT_RUN'
          (root/'device-acceptance.json').write_text(json.dumps({
            'physical_device':'NOT_RUN','adb':'NOT_USED',
            'mobile_data':'DEVICE_TEST_PENDING',
            'windows_native':'NOT_RUN','rust_android_ndk':'NOT_RUN',
            'expo':'NOT_RUN','production_release':False
          },indent=2)+'\n')
          PYTHON
      - name: Upload V541 identity-verified candidate (device acceptance pending)
        uses: actions/upload-artifact@v4
        with:
          name: AppForge-v9r2isolated3-upgrade-${{ github.sha }}
          path: upgrade-artifacts/
          retention-days: 14
          if-no-files-found: error
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated3-upgrade-tests-${{ github.sha }}
          path: android-app/app/build/test-results/testDebugUnitTest/
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/isolated3-upgrade-signing.p12"
