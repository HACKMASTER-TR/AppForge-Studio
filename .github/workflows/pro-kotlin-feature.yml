name: AppForge Pro Kotlin Feature CI

on:
  push:
    branches:
      - feat/cloudflare-control-plane-v1-20260919

permissions:
  contents: read

jobs:
  kotlin-compile:
    name: Android Kotlin Compile
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout feature source
        uses: actions/checkout@v7

      - name: Verify branch
        shell: bash
        run: |
          set -euo pipefail

          test "$GITHUB_REF" = \
            "refs/heads/feat/cloudflare-control-plane-v1-20260919"

          test -f cloudflare/control-plane/migrations/0005_pro_lifecycle.sql

          echo "FEATURE_SOURCE=PASS"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Prepare Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(
            find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              | sort -V \
              | tail -n 1
          )"

          test -x "$SDKMANAGER"

          "$SDKMANAGER" \
            "platforms;android-37.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"

          echo "ANDROID_TOOLCHAIN=PASS"

      - name: Compile Android Kotlin
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            -p android-app \
            :app:compileDebugKotlin \
            --no-daemon \
            --console=plain \
            --stacktrace

          echo "KOTLIN_COMPILE=PASS"
