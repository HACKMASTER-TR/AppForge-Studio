# Single-use isolated Stage 5E.8 diagnostic: NEVER build or install AppForge Studio.
# Its output is an independently sandboxed, debug-signed, permissionless Keystore test APK.
name: V9 Stage 5E8 Physical Keystore Probe Debug APK
'on':
  push:
    branches:
      - feat/v9-global-package-distribution-20261027
    paths:
      - .github/workflows/v9-stage5e8-keystore-physical-debug.yml
permissions:
  contents: read
concurrency:
  group: appforge-v9-stage5e8-physical-probe-once
  cancel-in-progress: false
jobs:
  isolated-probe-debug-apk:
    if: >-
      github.repository == 'HACKMASTER-TR/AppForge-Studio' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/feat/v9-global-package-distribution-20261027' &&
      github.event.before == '47ee00962d69039346f7d98f2966b44f6bafd1be' &&
      github.event.head_commit.message == 'ci(v9): isolated Stage5E8 physical keystore diagnostic apk'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - name: Checkout pinned V9 development state, without Git write token
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Exact parent, one-file diff, source Git blob pins and forbidden permission audit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '47ee00962d69039346f7d98f2966b44f6bafd1be'
          python3 - <<'PY'
          import pathlib,subprocess
          run=lambda *a:subprocess.check_output(['git',*a],text=True).strip()
          name='.github/workflows/v9-stage5e8-keystore-physical-debug.yml'
          assert run('diff-tree','--no-commit-id','--name-status','-r','HEAD')=='A\t'+name,'Unexpected changes: deny'
          pins={
            'android-app/app/src/main/java/com/appforge/studio/security/V9AdminProofWire.kt':'2bacd63fb2078c410dcdbcb18e0b678572d70ff9',
            'android-app/app/src/main/java/com/appforge/studio/security/V9AdminP256SigningCore.kt':'d54ce3c891a35b7e0081d87c649b74c4bc48bdae',
            'android-app/app/src/main/java/com/appforge/studio/security/V9AdminKeystoreRequestSigner.kt':'be7d9306c53b1e26051a58f529177a07abbc8b34',
            'quality/v9-stage5e6-keystore-probe/build.gradle.kts':'3420b1838e83cf4c53982a4276393001aba00a05',
            'quality/v9-stage5e6-keystore-probe/settings.gradle.kts':'efbccb3cb2f53a8c1e574dee8007d7853ef70220',
            'quality/v9-stage5e6-keystore-probe/src/main/AndroidManifest.xml':'b60713445b387363c0081dee62841bbdff07608e',
            'quality/v9-stage5e6-keystore-probe/src/main/java/com/appforge/studio/security/V9S5E6KeystoreProbeActivity.kt':'a0ddd96e989f5c83dec45a0124c6212019afa956',
          }
          for p,sha in pins.items(): assert run('rev-parse','HEAD:'+p)==sha,('Pinned source changed',p)
          manifest=pathlib.Path('quality/v9-stage5e6-keystore-probe/src/main/AndroidManifest.xml').read_text()
          assert '<uses-permission' not in manifest and 'android:allowBackup="false"' in manifest
          assert 'android:exported="true"' in manifest
          gradle=pathlib.Path('quality/v9-stage5e6-keystore-probe/build.gradle.kts').read_text()
          assert 'applicationId = "com.appforge.v9.keystoreprobe"' in gradle
          assert 'com.appforge.studio"' not in gradle
          assert run('status','--porcelain')==''
          print('S5E8_SOURCE_PIN=PASS;FILES=7;EXACT_NEW_WORKFLOW=YES;NO_INTERNET=YES')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install isolated Android SDK 37 compile platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --channel=3 'platforms;android-37.0'
          test -s "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -s "$ANDROID_HOME/platforms/android-37/android.jar"
          echo 'S5E8_ANDROID_SDK=PASS;PLATFORM=37'
      - name: Build separate debug Keystore probe APK only (never AppForge APK)
        shell: bash
        run: |
          set -euo pipefail
          R=quality/v9-stage5e6-keystore-probe
          S=android-app/app/src/main/java/com/appforge/studio/security
          D="$R/src/main/java/com/appforge/studio/security"
          mkdir -p "$D"
          for name in V9AdminProofWire.kt V9AdminP256SigningCore.kt V9AdminKeystoreRequestSigner.kt; do
            cp "$S/$name" "$D/$name"
            cmp "$S/$name" "$D/$name"
          done
          gradle -p "$R" :assembleDebug --no-daemon --stacktrace > "$RUNNER_TEMP/s5e8-build.log" 2>&1 || {
            tail -n 130 "$RUNNER_TEMP/s5e8-build.log"; exit 1;
          }
          grep -q 'BUILD SUCCESSFUL' "$RUNNER_TEMP/s5e8-build.log"
          echo 'S5E8_BUILD=PASS;ONLY_ISOLATED_PROBE=YES;APPFORGE_ASSEMBLE=NO'
      - name: Verify APK identity, manifest permissions, debug signature and artifact SHA256
        shell: bash
        run: |
          set -euo pipefail
          R=quality/v9-stage5e6-keystore-probe
          mapfile -t APKS < <(find "$R/build/outputs/apk/debug" -type f -name '*.apk' | sort)
          test "${#APKS[@]}" -eq 1
          APK="${APKS[0]}"
          test -s "$APK"
          test ! -d android-app/app/build/outputs/apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$AAPT" && test -x "$SIGNER"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/s5e8-badging.txt"
          grep -Fq "package: name='com.appforge.v9.keystoreprobe'" "$RUNNER_TEMP/s5e8-badging.txt"
          grep -Fq "sdkVersion:'26'" "$RUNNER_TEMP/s5e8-badging.txt"
          "$AAPT" dump permissions "$APK" > "$RUNNER_TEMP/s5e8-permissions.txt"
          ! grep -Eiq 'uses-permission' "$RUNNER_TEMP/s5e8-permissions.txt"
          "$SIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/s5e8-signing.txt"
          mkdir -p "$RUNNER_TEMP/s5e8-artifact"
          cp "$APK" "$RUNNER_TEMP/s5e8-artifact/AppForgeV9-KeystoreProbe-S5E8-debug.apk"
          (cd "$RUNNER_TEMP/s5e8-artifact" && sha256sum AppForgeV9-KeystoreProbe-S5E8-debug.apk > SHA256SUMS)
          (cd "$RUNNER_TEMP/s5e8-artifact" && sha256sum -c SHA256SUMS)
          test -z "$(git diff --name-only)"
          echo 'S5E8_APK=PASS;PACKAGE=com.appforge.v9.keystoreprobe;PERMISSIONS=NONE;SIGNATURE=DEBUG'
          echo 'S5E8_APPFORGE_APK=UNCHANGED;GOOGLE_ADMIN_LOGIN=NO;CLOUDFLARE_DEPLOY=NO'
          echo 'S5E8_PHYSICAL_KEYSTORE=NOT_TESTED;USER_INSTALL_REQUIRED=YES;PRODUCTION=BLOCKED'
      - name: Upload ONLY isolated probe debug APK and SHA256 (no releases)
        uses: actions/upload-artifact@v4
        with:
          name: v9-s5e8-keystore-probe-${{ github.sha }}
          path: ${{ runner.temp }}/s5e8-artifact/
          if-no-files-found: error
          retention-days: 3
