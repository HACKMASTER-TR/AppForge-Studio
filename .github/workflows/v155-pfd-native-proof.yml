name: AppForge V15.5 PFD Proof CI

on:
  push:
    branches:
      - research/v155-play-offline-delivery-20261014
    paths:
      - .github/workflows/v155-pfd-native-proof.yml
      - tools/play-offline-delivery/**

permissions:
  contents: read

jobs:
  pfd-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "HACKMASTER-TR/AppForge-Studio"
          test "$GITHUB_REF" = "refs/heads/research/v155-play-offline-delivery-20261014"
          echo "ISOLATED_BRANCH=PASS"
          echo "PLAY_PUBLISH=DISABLED"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install SDK components using runner SDK
        shell: bash
        run: |
          set -euo pipefail

          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$ANDROID_HOME/cmdline-tools"                 -type f -name sdkmanager |
              sort -V |
              tail -n 1
            )"
          fi

          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"

          "$SDKMANAGER" --version

          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'

          test -s "$ANDROID_HOME/platforms/android-36/android.jar"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          test -d "$ANDROID_HOME/cmake/3.22.1"

          echo "ANDROID_SDK_COMPONENTS=PASS"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify fixture
        working-directory: tools/play-offline-delivery/pfd-native-proof
        run: |
          node --check audit-fixture.js
          node audit-fixture.js

      - name: Build standalone AAB
        working-directory: tools/play-offline-delivery/pfd-native-proof
        run: |
          gradle --no-daemon --stacktrace :app:bundleDebug

      - name: Verify AAB structure
        shell: bash
        working-directory: tools/play-offline-delivery/pfd-native-proof
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          bundles = list(
              Path("app/build/outputs/bundle/debug").glob("*.aab")
          )

          assert len(bundles) == 1, (
              f"Expected one AAB, found {len(bundles)}"
          )

          bundle = bundles[0]
          assert bundle.stat().st_size > 1024

          with ZipFile(bundle) as archive:
              entries = set(archive.namelist())
              required = {
                  "base/manifest/AndroidManifest.xml",
                  "nativeprobe/manifest/AndroidManifest.xml",
                  "nativeprobe/lib/arm64-v8a/libv155proof.so",
              }
              missing = sorted(required - entries)
              assert not missing, f"Missing AAB entries: {missing}"

          print("AAB_FILE=PASS")
          print("PFD_MODULE_INCLUDED=PASS")
          print("ARM64_JNI_LIBRARY_INCLUDED=PASS")
          print("PFD_AAB_STRUCTURE=PASS")
          print("PLAY_DELIVERY=NOT_TESTED")
          PY

      - name: Verify bundletool distribution and split APKs
        shell: bash
        working-directory: tools/play-offline-delivery/pfd-native-proof
        run: |
          set -euo pipefail

          TOOL="$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          AAB="app/build/outputs/bundle/debug/app-debug.aab"
          APKS="$RUNNER_TEMP/appforge-v155-proof.apks"

          test -s "$AAB"

          curl --fail --location --silent --show-error --retry 3             -o "$TOOL"             "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar"

          printf '%s  %s\n'             'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29'             "$TOOL" | sha256sum -c -

          echo "BUNDLETOOL_INTEGRITY=PASS"

          java -jar "$TOOL" validate --bundle="$AAB"

          echo "BUNDLETOOL_VALIDATE=PASS"

          java -jar "$TOOL" dump manifest             --bundle="$AAB"             --module=nativeprobe             > "$RUNNER_TEMP/v155-nativeprobe-manifest.xml"

          grep -Fq 'on-demand'             "$RUNNER_TEMP/v155-nativeprobe-manifest.xml"

          echo "BUNDLETOOL_ON_DEMAND=PASS"

          java -jar "$TOOL" build-apks             --bundle="$AAB"             --output="$APKS"             --mode=default             --aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2"

          test -s "$APKS"

          unzip -Z1 "$APKS" | grep -E             '(^|/)nativeprobe.*\.apk$'

          echo "BUNDLETOOL_BUILD_APKS=PASS"
          echo "NATIVE_FEATURE_SPLIT=PASS"
          echo "PLAY_UPLOAD=NOT_RUN"
          echo "DEVICE_INSTALL=NOT_RUN"

      - name: Build local-testing APK set
        shell: bash
        working-directory: tools/play-offline-delivery/pfd-native-proof
        run: |
          set -euo pipefail

          TOOL="$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          AAB="app/build/outputs/bundle/debug/app-debug.aab"
          APKS="$RUNNER_TEMP/appforge-v155-pfd-local-testing.apks"

          test -s "$TOOL"
          test -s "$AAB"
          test ! -e "$APKS"

          java -jar "$TOOL" build-apks             --bundle="$AAB"             --output="$APKS"             --mode=default             --local-testing             --aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2"

          test -s "$APKS"
          unzip -tqq "$APKS"

          unzip -Z1 "$APKS"             > "$RUNNER_TEMP/v155-local-testing-entries.txt"

          grep -Eq '(^|/)base[^/]*[.]apk$'             "$RUNNER_TEMP/v155-local-testing-entries.txt"

          grep -Eq '(^|/)nativeprobe[^/]*[.]apk$'             "$RUNNER_TEMP/v155-local-testing-entries.txt"

          echo "LOCAL_TEST_APKS=PASS"
          echo "BASE_SPLIT=PASS"
          echo "ON_DEMAND_SPLIT=PASS"
          echo "REAL_PLAY_DELIVERY=NOT_TESTED"
          echo "DEVICE_INSTALL=NOT_RUN"

      - name: Upload local-testing APK archive
        uses: actions/upload-artifact@v4
        with:
          name: appforge-v155-pfd-local-testing-apks
          path: ${{ runner.temp }}/appforge-v155-pfd-local-testing.apks
          if-no-files-found: error
          retention-days: 7

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: appforge-v155-pfd-native-proof
          path: tools/play-offline-delivery/pfd-native-proof/app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error
          retention-days: 7
