name: AppForge Pro Controlled Staging Deploy

on:
  push:
    branches:
      - feat/cloudflare-control-plane-v1-20260919
    paths:
      - cloudflare/control-plane/.pro-staging-deploy-request

permissions:
  contents: read

jobs:
  deploy-staging-control-plane:
    name: Deploy Only appforge-control-plane
    if: >-
      github.repository == 'HACKMASTER-TR/AppForge-Studio' &&
      github.ref == 'refs/heads/feat/cloudflare-control-plane-v1-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Verify explicit deploy-request commit
        shell: bash
        run: |
          set -euo pipefail

          MARKER="cloudflare/control-plane/.pro-staging-deploy-request"

          test "$GITHUB_REF" = \
            "refs/heads/feat/cloudflare-control-plane-v1-20260919"

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          test "$(git show -s --format=%s HEAD)" = \
            "deploy(staging): appforge-control-plane"

          test "$(git diff --name-only HEAD^ HEAD)" = "$MARKER"

          test -f "$MARKER"

          test "$(cat "$MARKER")" = \
            "$(git rev-parse HEAD^)"

          echo "TARGET=appforge-control-plane"
          echo "EXPLICIT_DEPLOY_REQUEST=PASS"
          echo "SOURCE_CHANGE_IN_DEPLOY_COMMIT=NONE"

      - name: Set up Linux Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Verify existing Cloudflare target read-only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          python3 .github/scripts/pro_cloudflare_auth_preflight.py

      - name: Dry-run then deploy ONLY staging Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          set +x
          umask 077

          CONFIG="$(
            mktemp \
              "$PWD/cloudflare/control-plane/.wrangler-ci-XXXXXXXX.toml"
          )"
          trap 'rm -f "$CONFIG"' EXIT

          cat > "$CONFIG" <<TOML
          name = "appforge-control-plane"
          main = "src/index.mjs"
          compatibility_date = "2026-09-19"
          workers_dev = true
          preview_urls = false
          keep_vars = true

          [[d1_databases]]
          binding = "DB"
          database_name = "appforge-control-plane-db"
          database_id = "$CLOUDFLARE_D1_DATABASE_ID"
          migrations_dir = "migrations"
          TOML

          cd cloudflare/control-plane

          LOG="$RUNNER_TEMP/pro-staging-deploy.log"
          OUTDIR="$RUNNER_TEMP/pro-staging-bundle"
          mkdir -p "$OUTDIR"

          if npx --yes wrangler@4 deploy \
              --config "$CONFIG" \
              --dry-run \
              --keep-vars \
              --outdir "$OUTDIR" >"$LOG" 2>&1
          then
            echo "WRANGLER_DRY_RUN=PASS"
          else
            echo "STOP: DRY_RUN_FAILED"
            echo "WORKER_DEPLOY=NOT_STARTED"
            exit 1
          fi

          if npx --yes wrangler@4 deploy \
              --config "$CONFIG" \
              --keep-vars >"$LOG" 2>&1
          then
            echo "WORKER_DEPLOY=PASS"
          else
            echo "STOP: WORKER_DEPLOY_FAILED"
            exit 1
          fi

          echo "TARGET_WORKER=appforge-control-plane"
          echo "DB_BINDING=DB"
          echo "GOOGLE_VARIABLE_VALUES=NOT_PRINTED"
          echo "MIGRATIONS_APPLY=NOT_STARTED"
          echo "MAIN=UNTOUCHED"
          echo "PLAY_PRODUCTION=UNTOUCHED"

      - name: Verify deployed staging routes without writes
        shell: bash
        run: |
          set -euo pipefail
          set +x

          python3 - <<'PY'
          import json
          import os
          import subprocess
          import tempfile

          base = (
              "https://appforge-control-plane."
              "28550040284a.workers.dev"
          )

          def read(path):
              with tempfile.TemporaryDirectory() as temp_dir:
                  headers_path = os.path.join(
                      temp_dir, "headers.txt"
                  )
                  body_path = os.path.join(
                      temp_dir, "body.bin"
                  )

                  result = subprocess.run(
                      [
                          "curl",
                          "--silent",
                          "--show-error",
                          "--max-time",
                          "20",
                          "--max-redirs",
                          "0",
                          "--request",
                          "GET",
                          "--header",
                          (
                              "User-Agent: "
                              "AppForge-Staging-Audit/1.0"
                          ),
                          "--header",
                          "Accept: application/json",
                          "--dump-header",
                          headers_path,
                          "--output",
                          body_path,
                          "--write-out",
                          "%{http_code}",
                          base + path,
                      ],
                      check=False,
                      capture_output=True,
                      text=True,
                  )

                  if result.returncode != 0:
                      print("ROUTE=" + path)
                      print(
                          "CURL_EXIT="
                          + str(result.returncode)
                      )
                      raise SystemExit(
                          "STOP: LIVE_STAGING_NETWORK_ERROR"
                      )

                  status_text = result.stdout.strip()

                  if (
                      len(status_text) != 3
                      or not status_text.isdigit()
                  ):
                      print("ROUTE=" + path)
                      print("HTTP_STATUS_RAW=" + status_text)
                      raise SystemExit(
                          "STOP: LIVE_HTTP_STATUS_INVALID"
                      )

                  status = int(status_text)
                  content_type = ""

                  with open(
                      headers_path,
                      encoding="utf-8",
                      errors="replace",
                  ) as headers:
                      for line in headers:
                          if ":" not in line:
                              continue

                          key, value = line.split(":", 1)

                          if (
                              key.strip().lower()
                              == "content-type"
                          ):
                              content_type = value.strip()

                  with open(body_path, "rb") as body_file:
                      body = body_file.read(1048576)

              try:
                  payload = json.loads(body)
              except (ValueError, UnicodeDecodeError):
                  stripped = body.lstrip().lower()

                  if not body:
                      body_kind = "EMPTY"
                  elif (
                      stripped.startswith(b"<!doctype html")
                      or stripped.startswith(b"<html")
                  ):
                      body_kind = "HTML"
                  else:
                      body_kind = "OTHER"

                  mime = content_type.lower()

                  if "application/json" in mime:
                      type_kind = "JSON"
                  elif "text/html" in mime:
                      type_kind = "HTML"
                  else:
                      type_kind = "OTHER"

                  print("ROUTE=" + path)
                  print("HTTP_STATUS=" + str(status))
                  print(
                      "CONTENT_TYPE_CLASS=" + type_kind
                  )
                  print("BODY_CLASS=" + body_kind)

                  raise SystemExit(
                      "STOP: LIVE_RESPONSE_NOT_JSON"
                  )

              if not isinstance(payload, dict):
                  print("ROUTE=" + path)
                  print("HTTP_STATUS=" + str(status))
                  raise SystemExit(
                      "STOP: UNEXPECTED_RESPONSE_SHAPE"
                  )

              return status, payload

          print("HTTP_TRANSPORT=CURL")

          status, health = read("/health")

          if (
              status != 200
              or health.get("ok") is not True
              or health.get("database") != "reachable"
          ):
              raise SystemExit(
                  "STOP: STAGING_HEALTH_FAILED"
              )

          print("STAGING_HEALTH=PASS")
          print("D1_REACHABILITY=PASS")

          status, route = read(
              "/api/pro/code/ownership-challenge"
          )

          if (
              status != 405
              or route.get("error")
              != "method_not_allowed"
          ):
              raise SystemExit(
                  "STOP: PRO_ROUTE_FAILED"
              )

          print("PRO_OWNERSHIP_ROUTE=PASS")

          status, route = read(
              "/api/pro/code/status"
          )

          if (
              status != 405
              or route.get("error")
              != "method_not_allowed"
          ):
              raise SystemExit(
                  "STOP: PRO_STATUS_ROUTE_FAILED"
              )

          print("PRO_STATUS_ROUTE=PASS")
          print("HTTP_METHOD=GET_ONLY")
          print("DATABASE_WRITES=NONE")
          print("WORKER_DEPLOY=COMPLETED_BEFORE_SMOKE")
          print("MIGRATIONS_APPLY=NOT_STARTED")
          print("STAGING_SMOKE=PASS")
          PY
