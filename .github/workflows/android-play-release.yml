name: AppForge Play Release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APPFORGE_ANDROID_NDK_VERSION: "28.2.13676358"
  APPFORGE_ANDROID_CMAKE_VERSION: "3.22.1"

jobs:
  build-play-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Validate Play release secrets
        shell: bash
        env:
          APPFORGE_FIREBASE_GOOGLE_SERVICES_B64: ${{ secrets.APPFORGE_FIREBASE_GOOGLE_SERVICES_B64 }}
          APPFORGE_RELEASE_KEYSTORE_B64: ${{ secrets.APPFORGE_RELEASE_KEYSTORE_B64 }}
          APPFORGE_RELEASE_STORE_PASSWORD: ${{ secrets.APPFORGE_RELEASE_STORE_PASSWORD }}
          APPFORGE_RELEASE_KEY_PASSWORD: ${{ secrets.APPFORGE_RELEASE_KEY_PASSWORD }}
          APPFORGE_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.APPFORGE_GITHUB_OAUTH_CLIENT_ID }}
          APPFORGE_RAILWAY_OAUTH_CLIENT_ID: ${{ secrets.APPFORGE_RAILWAY_OAUTH_CLIENT_ID }}
        run: |
          set -euo pipefail

          required=(
            APPFORGE_FIREBASE_GOOGLE_SERVICES_B64
            APPFORGE_RELEASE_KEYSTORE_B64
            APPFORGE_RELEASE_STORE_PASSWORD
            APPFORGE_RELEASE_KEY_PASSWORD
            APPFORGE_GITHUB_OAUTH_CLIENT_ID
            APPFORGE_RAILWAY_OAUTH_CLIENT_ID
          )

          missing=0

          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "❌ Eksik GitHub secret: $name"
              missing=1
            fi
          done

          test "$missing" -eq 0

          echo "✅ Play release secret preflight PASS."

      - name: Install deterministic Android native toolchain
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(
            find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              | sort -V \
              | tail -n 1
          )"

          test -x "$SDKMANAGER"

          "$SDKMANAGER" \
            "ndk;${APPFORGE_ANDROID_NDK_VERSION}" \
            "cmake;${APPFORGE_ANDROID_CMAKE_VERSION}"

          test -d "$ANDROID_HOME/ndk/${APPFORGE_ANDROID_NDK_VERSION}"
          test -d "$ANDROID_HOME/cmake/${APPFORGE_ANDROID_CMAKE_VERSION}"

          echo "✅ Native toolchain PASS: NDK ${APPFORGE_ANDROID_NDK_VERSION} / CMake ${APPFORGE_ANDROID_CMAKE_VERSION}"

      - name: Restore and verify AppForge Firebase config
        shell: bash
        env:
          APPFORGE_FIREBASE_GOOGLE_SERVICES_B64: ${{ secrets.APPFORGE_FIREBASE_GOOGLE_SERVICES_B64 }}
        run: |
          set -euo pipefail

          printf '%s' "$APPFORGE_FIREBASE_GOOGLE_SERVICES_B64" \
            | base64 --decode \
            > android-app/app/google-services.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("android-app/app/google-services.json")

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          packages = set()

          for entry in data.get("client", []):
              package_name = (
                  entry
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package_name:
                  packages.add(package_name)

          expected = "com.appforge.studio"

          if expected not in packages:
              raise SystemExit(
                  f"Firebase config package mismatch. "
                  f"Expected {expected}; found {sorted(packages)}"
              )

          print("✅ Firebase package config PASS.")
          PY

      - name: Restore Play upload keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.APPFORGE_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode \
            > "$RUNNER_TEMP/appforge-release.jks"

          chmod 600 "$RUNNER_TEMP/appforge-release.jks"
          test -s "$RUNNER_TEMP/appforge-release.jks"

      - name: Verify release key
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.APPFORGE_RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          keytool -list \
            -keystore "$RUNNER_TEMP/appforge-release.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias appforge-release \
            > /dev/null

          echo "✅ Release upload keystore PASS."

      - name: Resolve AppForge version
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path(
              "android-app/app/build.gradle.kts"
          ).read_text(encoding="utf-8")

          code_match = re.search(
              r"\bversionCode\s*=\s*(\d+)",
              source
          )

          name_match = re.search(
              r'\bversionName\s*=\s*"([^"]+)"',
              source
          )

          if not code_match or not name_match:
              raise SystemExit(
                  "versionCode/versionName bulunamadı."
              )

          version_code = code_match.group(1)
          version_name = name_match.group(1)

          aab_name = (
              f"AppForgeStudio-Play-"
              f"{version_name}-{version_code}.aab"
          )

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as env:
              env.write(
                  f"APPFORGE_VERSION_CODE={version_code}\n"
              )
              env.write(
                  f"APPFORGE_VERSION_NAME={version_name}\n"
              )
              env.write(
                  f"APPFORGE_PLAY_AAB_NAME={aab_name}\n"
              )

          print(
              f"✅ Version: {version_name} "
              f"(versionCode {version_code})"
          )
          PY

      - name: Prepare Play Store manifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="android-app/app/src/main/AndroidManifest.xml"

          sed -i \
            '/android.permission.REQUEST_INSTALL_PACKAGES/d' \
            "$MANIFEST"

          if grep -q \
            'android.permission.REQUEST_INSTALL_PACKAGES' \
            "$MANIFEST"; then
            echo "❌ REQUEST_INSTALL_PACKAGES kaldırılamadı."
            exit 1
          fi

          echo "✅ Play Store manifest PASS."

      - name: Test lint and build signed Play AAB
        env:
          APPFORGE_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/appforge-release.jks
          APPFORGE_RELEASE_STORE_PASSWORD: ${{ secrets.APPFORGE_RELEASE_STORE_PASSWORD }}
          APPFORGE_RELEASE_KEY_ALIAS: appforge-release
          APPFORGE_RELEASE_KEY_PASSWORD: ${{ secrets.APPFORGE_RELEASE_KEY_PASSWORD }}
          APPFORGE_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.APPFORGE_GITHUB_OAUTH_CLIENT_ID }}
          APPFORGE_RAILWAY_OAUTH_CLIENT_ID: ${{ secrets.APPFORGE_RAILWAY_OAUTH_CLIENT_ID }}
        run: |
          set -euo pipefail

          gradle \
            -p android-app \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :app:signingReport \
            :app:bundleRelease \
            --stacktrace

      - name: Verify Play Store permissions
        shell: bash
        run: |
          set -euo pipefail

          FOUND="$(
            grep -R -l \
              --include='AndroidManifest.xml' \
              'android.permission.REQUEST_INSTALL_PACKAGES' \
              android-app/app/build/intermediates \
              2>/dev/null || true
          )"

          if [ -n "$FOUND" ]; then
            echo "❌ Play build içinde REQUEST_INSTALL_PACKAGES bulundu:"
            echo "$FOUND"
            exit 1
          fi

          echo "✅ Play permission regression PASS."

      - name: Verify signed AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB="$(
            find android-app/app/build/outputs/bundle/release \
              -type f \
              -name '*.aab' \
              -print \
              -quit
          )"

          test -n "$AAB"
          test -s "$AAB"

          jarsigner -verify "$AAB"

          cp \
            "$AAB" \
            "$APPFORGE_PLAY_AAB_NAME"

          sha256sum \
            "$APPFORGE_PLAY_AAB_NAME" \
            > "${APPFORGE_PLAY_AAB_NAME}.sha256"

          echo "✅ Signed Play AAB PASS."
          echo "Version: ${APPFORGE_VERSION_NAME} (${APPFORGE_VERSION_CODE})"

          ls -lh \
            "$APPFORGE_PLAY_AAB_NAME" \
            "${APPFORGE_PLAY_AAB_NAME}.sha256"

      - name: Upload Play AAB
        uses: actions/upload-artifact@v7
        with:
          name: AppForgeStudio-Play-AAB
          path: |
            AppForgeStudio-Play-*.aab
            AppForgeStudio-Play-*.aab.sha256
          if-no-files-found: error
          retention-days: 14
