name: AppForge Play Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-play-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore Play upload keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.APPFORGE_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_B64"

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode \
            > "$RUNNER_TEMP/appforge-release.jks"

          chmod 600 "$RUNNER_TEMP/appforge-release.jks"
          test -s "$RUNNER_TEMP/appforge-release.jks"

      - name: Verify release key
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.APPFORGE_RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          keytool -list \
            -keystore "$RUNNER_TEMP/appforge-release.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias appforge-release \
            > /dev/null

          echo "✅ Release keystore doğrulandı."

      - name: Build signed Play AAB
        env:
          APPFORGE_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/appforge-release.jks
          APPFORGE_RELEASE_STORE_PASSWORD: ${{ secrets.APPFORGE_RELEASE_STORE_PASSWORD }}
          APPFORGE_RELEASE_KEY_ALIAS: appforge-release
          APPFORGE_RELEASE_KEY_PASSWORD: ${{ secrets.APPFORGE_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          gradle \
            -p android-app \
            :app:bundleRelease \
            --stacktrace

      - name: Verify AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB="$(
            find android-app/app/build/outputs/bundle/release \
              -type f \
              -name '*.aab' \
              | head -n 1
          )"

          test -n "$AAB"
          test -s "$AAB"

          cp "$AAB" AppForgeStudio-Play-3.0.0.aab

          ls -lh AppForgeStudio-Play-3.0.0.aab

      - name: Upload Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: AppForgeStudio-Play-AAB
          path: AppForgeStudio-Play-3.0.0.aab
          if-no-files-found: error
          retention-days: 14
