# V9 user-authorized one-shot: dedicated disposable Worker only, real Cron/DO acceptance; no shared Witness writes.
name: V9 Stage5D One-Shot Real Cloudflare Cron DO Acceptance (Disposable)
'on':
  push:
    branches:
    - feat/v9-global-package-distribution-20261027
    paths:
    - .github/workflows/v9-stage5d-disposable-live-20261030.yml
permissions:
  contents: read
concurrency:
  group: v9-stage5d-accept-disposable-live-one-shot
  cancel-in-progress: false
jobs:
  r5-live:
    outputs:
      preflight_safe: ${{ steps.auth.outcome == 'success' }}
    if: 'github.run_attempt == 1 && github.repository == ''HACKMASTER-TR/AppForge-Studio'' && github.ref == ''refs/heads/feat/v9-global-package-distribution-20261027''
      && github.event_name == ''push'' && github.event.before == ''7980320562019ae96535b5a9aaf4b59af700ad2d'' && github.event.head_commit.message
      == ''test(v9): authorize one-shot Stage5D R5 streaming-json isolated live acceptance'''
    runs-on: ubuntu-24.04
    timeout-minutes: 39
    env:
      WRANGLER_SEND_METRICS: 'false'
      PROBE_CONFIG: cloudflare/v9-witness/stage5d-r3-probe/wrangler.toml
    steps:
    - name: Checkout pinned V9 commit
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 2
    - name: Fail closed on one-shot parent, file scope, and pinned R3 sources
      id: preflight
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import pathlib,subprocess,tomllib
        assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==__import__('os').environ['GITHUB_SHA']
        assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()=='7980320562019ae96535b5a9aaf4b59af700ad2d'
        assert subprocess.check_output(['git','diff-tree','--no-commit-id','--name-only','-r','HEAD'],text=True).strip()=='.github/workflows/v9-stage5d-disposable-live-20261030.yml'
        pins={'cloudflare/v9-witness/stage5d-r3-probe/entry.mjs': 'a13bfba95f5a848cc1a7a58aee7f20b22bbcde04', 'cloudflare/v9-witness/stage5d-r3-probe/scheduled.mjs': 'e5bff1fd72abaca6e9159d8d8b674c830fb535f1', 'cloudflare/v9-witness/stage5d-r3-probe/scheduled.test.mjs': '8a76ff8a27a85d1535825a71e712df5c600d7bb0', 'cloudflare/v9-witness/stage5d-r3-probe/wrangler.toml': 'fe743d26ea110f9f2a05a00353607cab21b17137', 'docs/engineering/appforge-v9-stage5d-r3-diagnostic.md': '0ac5b92e7cd61f5f8f053c2bee3156f70ca90cf8', 'cloudflare/v9-witness/stage5d-probe/core.mjs': '1605bbafa58780615f1ec66edc483f9fc25828e3', 'cloudflare/v9-witness/device-auth/stage5d-private.mjs': '537d8167550aca3eebc5de87299efb46b2ff12c7'}
        for path,expected in pins.items():
            actual=subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()
            assert actual==expected,('pinned file changed',path)
        c=tomllib.loads(pathlib.Path('cloudflare/v9-witness/stage5d-r3-probe/wrangler.toml').read_text())
        assert set(c)=={'name','main','compatibility_date','workers_dev','preview_urls','vars','durable_objects','migrations','triggers'}
        assert c['name']=='appforge-v9-stage5d-r3-disposable-20261029'
        assert c['main']=='entry.mjs' and c['workers_dev'] is False and c['preview_urls'] is False
        assert c['vars']=={'STAGE5D_TEST_MODE':'SYNTHETIC_ONLY','STAGE5D_R3_DIAGNOSTIC':'ENABLED'}
        assert c['triggers']=={'crons':['* * * * *']}
        assert c['durable_objects']['bindings']==[{'name':'V9_STAGE5D_R3_PROBE','class_name':'V9Stage5DR3DO'}]
        assert c['migrations']==[{'tag':'v1','new_sqlite_classes':['V9Stage5DR3DO']}]
        print('R3_EXACT_COMMIT_AND_SOURCE_PINS=PASS;PUBLIC_ROUTE=DISABLED')
        PY
    - name: Prepare Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Run 552 offline tests and compile R3 without deployment
      id: offline
      shell: bash
      run: |
        set -euo pipefail
        run_tap(){
          local label="$1" expected="$2" file="$3" log="$RUNNER_TEMP/$1.tap"
          if ! node --test --test-reporter=tap "$file" > "$log" 2>&1; then tail -90 "$log"; exit 1; fi
          for row in "# tests $expected" "# pass $expected" "# fail 0" "# skipped 0" "# cancelled 0"; do
            if ! grep -Fxq "$row" "$log"; then tail -90 "$log"; exit 1; fi
          done
          echo "$label=$expected PASS"
        }
        run_tap R3_STAGE5A 17 cloudflare/v9-witness/device-auth/protocol.test.mjs
        run_tap R3_STAGE5B 27 cloudflare/v9-witness/device-auth/registry.test.mjs
        run_tap R3_STAGE5C 24 cloudflare/v9-witness/device-auth/admin-oidc.test.mjs
        run_tap R3_STAGE5D 2 cloudflare/v9-witness/stage5d-probe/core.test.mjs
        run_tap R3_WITNESS 28 cloudflare/v9-witness/witness.test.mjs
        run_tap R3_R2_WORKER 8 cloudflare/package-distribution/worker.test.mjs
        run_tap R3_DIAGNOSTIC 6 cloudflare/v9-witness/stage5d-r3-probe/scheduled.test.mjs
        log="$RUNNER_TEMP/r3-python-440.log"
        if ! PYTHONWARNINGS=error::ResourceWarning python3 -B -m unittest discover -s quality/tests -p 'test_v9_*.py' -v > "$log" 2>&1; then tail -100 "$log"; exit 1; fi
        if ! grep -Eq '^Ran 440 tests? in ' "$log" || ! grep -Fxq 'OK' "$log" || grep -Eq 'ResourceWarning|\.\.\. skipped ' "$log"; then
          tail -100 "$log";echo 'R3_PYTHON_GATE_FAILED';exit 1
        fi
        echo 'R3_FULL_OFFLINE_552=PASS;NODE=112;PYTHON=440;FAIL=0;SKIP=0'
        npx --yes wrangler@4.153.0 deploy --dry-run --config "$PROBE_CONFIG" --outdir "$RUNNER_TEMP/r3-dry-run"
        echo 'R3_WRANGLER_BUNDLE_DRY_RUN=PASS;CLOUDFLARE_MUTATIONS=0'
    - name: Cloudflare read-only preflight and canonical Witness snapshot
      id: auth
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        set -euo pipefail
        umask 077
        cat > "$RUNNER_TEMP/r3_cloudflare_guard.py" <<'PY'
        import hashlib,json,os,re,sys,time,urllib.error,urllib.request
        from email import policy
        from email.parser import BytesParser
        from pathlib import Path
        ACCOUNT=os.environ.get('CLOUDFLARE_ACCOUNT_ID','').strip()
        TOKEN=os.environ.get('CLOUDFLARE_API_TOKEN','').strip()
        WORKER='appforge-v9-witness-isolated-staging'
        VERSION='52375f28-4c72-46bf-b8a5-fa3b7bacfb53'
        ETAG='9b2fed53f8a2daf5dd60e995bbc7af20a47eeaee595232b8ca485ce8218eb81a'
        TARGET='appforge-v9-stage5d-accept-smoke-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
        RUNNER=Path(os.environ['RUNNER_TEMP'])
        ROOT='https://api.cloudflare.com/client/v4/accounts/'+ACCOUNT+'/workers/scripts/'
        def require(ok,reason):
            if not ok:raise RuntimeError(reason)
        def http(url,method='GET'):
            require(url==ROOT[:-1] or url.startswith(ROOT) or url=='https://api.cloudflare.com/client/v4/accounts/'+ACCOUNT+'/tokens/verify','unapproved API path')
            require(method=='GET' or (method=='DELETE' and url==ROOT+TARGET),'unapproved HTTP method')
            req=urllib.request.Request(url,method=method,headers={'Authorization':'Bearer '+TOKEN,'Accept':'application/json'})
            try:
                with urllib.request.urlopen(req,timeout=35) as r:
                    return r.status,r.read(6_000_001),r.headers.get('Content-Type','')
            except urllib.error.HTTPError as e:
                if e.code==404:return 404,b'',''
                raise RuntimeError('HTTP_'+str(e.code)) from None
            except (TimeoutError,urllib.error.URLError):raise RuntimeError('CLOUDFLARE_NETWORK') from None
        def api(url):
            status,body,_=http(url)
            require(status==200 and len(body)<=6_000_000,'api status/size')
            obj=json.loads(body)
            require(obj.get('success') is True,'api unsuccessful')
            return obj

        def canonical(mime,raw):
            require(len(raw)<=6_000_000,'witness size')
            if not mime.lower().startswith('multipart/'):
                return hashlib.sha256(raw).hexdigest()
            require('\r' not in mime and '\n' not in mime,'header injection')
            msg=BytesParser(policy=policy.default).parsebytes(b'MIME-Version: 1.0\r\nContent-Type: '+mime.encode('ascii')+b'\r\n\r\n'+raw)
            require(msg.is_multipart(),'multipart invalid')
            parts=[]
            for part in msg.walk():
                if part.is_multipart():continue
                name=part.get_param('name',header='content-disposition') or ''
                filename=part.get_filename() or ''
                content=part.get_payload(decode=True)
                require(isinstance(content,bytes),'invalid part')
                parts.append((name,filename,hashlib.sha256(content).hexdigest()))
            require(1<=len(parts)<=200,'invalid part count')
            return hashlib.sha256(json.dumps(sorted(parts),separators=(',',':')).encode()).hexdigest()
        def witness():
            deployed=api(ROOT+WORKER+'/deployments')
            results=deployed['result']; arr=results.get('deployments') if isinstance(results,dict) else results
            require(isinstance(arr,list) and len(arr)==1,'witness deployment history drift')
            versions=arr[0].get('versions') or []
            require(len(versions)==1 and versions[0].get('version_id')==VERSION and versions[0].get('percentage')==100,'witness deployed version drift')
            require((deployed.get('result_info') or {}).get('total_pages',1)==1,'deploy history pagination')
            v=api(ROOT+WORKER+'/versions/'+VERSION)['result']
            require(((v.get('resources') or {}).get('script') or {}).get('etag')==ETAG,'witness ETag drift')
            fingerprints=[]
            for _ in range(2):
                status,body,mime=http(ROOT+WORKER)
                require(status==200,'witness disappeared')
                fingerprints.append(canonical(mime,body))
            require(fingerprints[0]==fingerprints[1],'witness unstable representation')
            return fingerprints[0]
        def check_workers():
            obj=api(ROOT[:-1]); data=obj.get('result')
            require(isinstance(data,list),'worker listing invalid')
            info=obj.get('result_info') or {}
            require(info.get('total_pages',1)<=1 and info.get('total_count',len(data))<=len(data),'worker listing pagination')
            names={w.get('id') for w in data if isinstance(w,dict)}
            require(WORKER in names,'original witness missing')
            require(TARGET not in names,'r3 target already exists')
            require(not any(isinstance(n,str) and (n.startswith('appforge-v9-stage5d-accept-smoke-') or n.startswith('appforge-v9-stage5d-r3-smoke-') or n.startswith('appforge-v9-stage5d-r4-smoke-') or n.startswith('appforge-v9-stage5d-r5-smoke-') or n.startswith('appforge-v9-stage5d-live-smoke-')) for n in names),'stale Stage5D disposable worker')
        def preflight():
            require(re.fullmatch(r'[0-9a-fA-F]{32}',ACCOUNT) is not None and len(TOKEN)>20,'missing token/account')
            auth=api('https://api.cloudflare.com/client/v4/accounts/'+ACCOUNT+'/tokens/verify')['result']
            require(auth.get('status')=='active','account token inactive')
            check_workers()
            fingerprint=witness()
            path=RUNNER/'r3-witness-baseline.json'
            path.write_text(json.dumps({'fingerprint':fingerprint,'version':VERSION,'etag':ETAG})+'\n')
            path.chmod(0o600)
            print('R3_ACCOUNT_API_TOKEN=PASS;WITNESS_BASELINE_PINNED=PASS;TARGET_UNUSED=PASS')
        def cleanup():
            require(re.fullmatch(r'appforge-v9-stage5d-accept-smoke-[0-9]+-[0-9]+',TARGET) is not None,'target pattern')
            armed=(RUNNER/'r3-deploy-armed').exists()
            status,_,_=http(ROOT+TARGET)
            if not armed:
                require(status==404,'unarmed Worker exists; require manual review')
                print('R3_DISPOSABLE_NOT_ARMED=PASS')
            elif status==200:
                code,body,_=http(ROOT+TARGET,'DELETE')
                require(200<=code<300,'delete not successful')
                if body:require(json.loads(body).get('success') is True,'cloudflare delete refused')
                for _ in range(10):
                    s,_,_=http(ROOT+TARGET)
                    if s==404:break
                    time.sleep(3)
                else:raise RuntimeError('deleted Worker still visible')
                print('R3_DISPOSABLE_DELETED=PASS')
            elif status==404:
                print('R3_DISPOSABLE_ABSENT=PASS')
            else:raise RuntimeError('unexpected disposable state')
            baseline=RUNNER/'r3-witness-baseline.json'
            current=witness()
            if baseline.exists():
                previous=json.loads(baseline.read_text())
                require(previous['fingerprint']==current,'witness canonical content changed')
                print('R3_WITNESS_BASELINE_VS_CLEANUP=PASS')
            else:
                print('R3_WITNESS_BASELINE_NOT_AVAILABLE;HISTORICAL_CONTENT_UNPROVEN')
            print('R3_WITNESS_DEPLOYED_VERSION_ETAG=PASS')
            print('R3_CLEANUP_AND_WITNESS_INTEGRITY=PASS')
        if __name__=='__main__':
            try:
                {'preflight':preflight,'cleanup':cleanup}[sys.argv[1]]()
            except Exception as e:
                # No response bodies or secret-bearing strings. Print only exception CLASS.
                print('R3_CLOUDFLARE_GUARD=BLOCKED;PHASE='+sys.argv[1]+';ERROR_TYPE='+type(e).__name__)
                sys.exit(1)
        PY
        python3 "$RUNNER_TEMP/r3_cloudflare_guard.py" preflight
    - name: Deploy only disposable R3 Worker and observe TWO real Cron events
      id: live
      continue-on-error: true
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        set -Eeuo pipefail
        set +x
        umask 077
        export PROBE_NAME="appforge-v9-stage5d-accept-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        [[ "$PROBE_NAME" =~ ^appforge-v9-stage5d-accept-smoke-[0-9]+-[0-9]+$ ]]
        echo 'R3_DEPLOY_SCOPE=EXACT_DISPOSABLE_ONLY;PUBLIC_ROUTE=DISABLED'
        python3 "$RUNNER_TEMP/r3_cloudflare_guard.py" preflight
        echo 'S5D_PREDEPLOY_READONLY_RECHECK=PASS'
        # Arm cleanup BEFORE invoking Wrangler; secondary job handles unexpected job loss.
        touch "$RUNNER_TEMP/r3-deploy-armed"
        npx --yes wrangler@4.153.0 deploy --name "$PROBE_NAME" --config "$PROBE_CONFIG"
        echo 'R3_DISPOSABLE_DEPLOYED=PASS'
        python3 - <<'PY'
        import json,os,time,urllib.error,urllib.request
        A=os.environ['CLOUDFLARE_ACCOUNT_ID'];T=os.environ['CLOUDFLARE_API_TOKEN'];N=os.environ['PROBE_NAME']
        url=f'https://api.cloudflare.com/client/v4/accounts/{A}/workers/scripts/{N}/schedules'
        for i in range(12):
            try:
                with urllib.request.urlopen(urllib.request.Request(url,headers={'Authorization':'Bearer '+T,'Accept':'application/json'}),timeout=30) as r:
                    obj=json.load(r)
                assert obj.get('success') is True
                a=(obj.get('result') or {}).get('schedules')
                assert isinstance(a,list)
                if [s.get('cron') for s in a]==['* * * * *']:
                    print('R3_CRON_SCHEDULE_API=PASS;EXACT_ONE_MINUTE=YES');break
            except (urllib.error.HTTPError,urllib.error.URLError,ValueError,TimeoutError):pass
            time.sleep(5)
        else:
            print('R3_CRON_SCHEDULE_API=NOT_VERIFIED');raise SystemExit(1)
        PY
        # Tail only deployed R3 Worker; never print raw logs or secret-bearing exception bodies.
        : > "$RUNNER_TEMP/r3-tail.jsonl"
        npx --yes wrangler@4.153.0 tail "$PROBE_NAME" --format json > "$RUNNER_TEMP/r3-tail.jsonl" 2> "$RUNNER_TEMP/r3-tail-stderr.log" &
        TAIL_PID=$!
        trap 'kill "$TAIL_PID" 2>/dev/null || true' EXIT
        sleep 10
        kill -0 "$TAIL_PID" 2>/dev/null || { echo 'R3_TAIL_STARTUP=BLOCKED';exit 1; }
        # R5: exact parser core tested in isolation; accepts JSON objects spanning lines.
        # Tail reads the exact run-scoped Worker only, and rejects explicit foreign script names.
        cat > "$RUNNER_TEMP/r3_tail_check.py" <<'PY'
        #!/usr/bin/env python3
        """Stage 5D R5: read-only Cloudflare Wrangler Tail stream evidence evaluator.

        Handles newline-delimited OR indented, multi-line JSON objects. Does NOT deploy,
        write GitHub, call APIs, or access credentials. It never outputs raw log content.
        For null scriptName, the caller MUST guarantee that --input is sourced ONLY from
        `wrangler tail <exact-disposable-worker> --format json` (not a shared log stream).
        """
        import argparse
        import contextlib
        import io
        import json
        import os
        import re
        import shutil
        import subprocess
        import sys
        from pathlib import Path

        CRON = "* * * * *"
        INITIAL = "V9_STAGE5D_R3_INITIAL=PASS;ENROLL=PASS;OIDC=PASS;APPROVE=PASS;CHALLENGE=PASS;REVOKE=PASS"
        RESTART = "R3_RESTART_REQUESTED=YES;CONFIRMATION=PENDING_SECOND_INVOCATION"
        FINAL = "V9_STAGE5D_R3_LIVE=PASS;OIDC=PASS;ENROLL=PASS;APPROVE=PASS;REVOKE=PASS;RESTART=PASS;PERSIST=PASS;DENY=PASS"
        PERSIST = "R3_RESTART_PERSISTENCE=PASS"
        WORKER_RE = re.compile(r"appforge-v9-stage5d-accept-smoke-[0-9]+-[0-9]+\Z")
        MAX_BYTES = 6_000_000


        def decode_objects(source):
            """Decode concatenated JSON docs, preserving incomplete final event as pending."""
            if len(source.encode('utf-8')) > MAX_BYTES:
                return [], 'OVERSIZE'
            source = source.lstrip('\ufeff')
            decoder = json.JSONDecoder()
            parsed = []
            position = 0
            while position < len(source):
                while position < len(source) and source[position].isspace():
                    position += 1
                if position == len(source):
                    break
                # A tail reader can catch an in-progress pretty JSON object while it is
                # being appended. Treat that final fragment as pending, never as proof.
                if source[position] not in '{[':
                    return parsed, 'NON_JSON_DATA'
                try:
                    obj, end = decoder.raw_decode(source, position)
                except json.JSONDecodeError:
                    if source[position] in '{[':
                        return parsed, 'INCOMPLETE_OR_MALFORMED_TRAILING_JSON'
                    return parsed, 'NON_JSON_DATA'
                if not isinstance(obj, dict):
                    return parsed, 'NON_OBJECT_JSON'
                parsed.append(obj)
                position = end
            return parsed, None


        def check_evidence(source, worker):
            counts = {'events': 0, 'null_script': 0, 'null_event': 0,
                      'initial': 0, 'final': 0, 'failed': 0, 'foreign': 0}
            if not WORKER_RE.fullmatch(worker):
                return 'BLOCKED', counts, 'UNSAFE_WORKER_NAME'
            records, decode_error = decode_objects(source)
            if decode_error in ('NON_JSON_DATA', 'NON_OBJECT_JSON', 'OVERSIZE'):
                return 'BLOCKED', counts, decode_error
            first, second = [], []
            for obj in records:
                counts['events'] += 1
                name = obj.get('scriptName')
                if name is not None and name != worker:
                    counts['foreign'] += 1
                    continue
                if name is None:
                    counts['null_script'] += 1
                event = obj.get('event')
                if event is None:
                    counts['null_event'] += 1
                elif not isinstance(event, dict) or (event.get('cron') is not None and event.get('cron') != CRON):
                    continue
                timestamp = obj.get('eventTimestamp')
                if not isinstance(timestamp, (int,float)) or isinstance(timestamp, bool) or timestamp <= 0:
                    continue
                messages = []
                for record in obj.get('logs') or []:
                    if not isinstance(record,dict):
                        continue
                    m = record.get('message')
                    if isinstance(m,str):
                        messages.append(m)
                    elif isinstance(m,list):
                        messages.extend(a for a in m if isinstance(a,str))
                if any('R3_SCHEDULED_FAILURE=YES' in x for x in messages):
                    counts['failed'] += 1
                valid = obj.get('outcome') == 'ok' and not obj.get('exceptions')
                if INITIAL in messages:
                    counts['initial'] += 1
                if FINAL in messages:
                    counts['final'] += 1
                if valid and INITIAL in messages and RESTART in messages:
                    first.append(timestamp)
                if valid and FINAL in messages and PERSIST in messages:
                    second.append(timestamp)
            if counts['failed'] or counts['foreign']:
                return 'BLOCKED',counts,'ERROR_OR_FOREIGN_WORKER'
            if any(t2>t1 for t1 in first for t2 in second):
                # A concurrent append may yield an incomplete trailing JSON event; ignore
                # that fragment only after two fully decoded, valid independent records.
                return 'PASS',counts,'TWO_DISTINCT_COMPLETE_EVENTS'
            return 'NOT_VERIFIED',counts,decode_error or 'MISSING_TWO_EVENTS'


        def run_self_test():
            W='appforge-v9-stage5d-accept-smoke-123-1'
            def item(t, markers, *, script=None, event=None, outcome='ok', exceptions=None):
                return {'scriptName':script,'event':event,'eventTimestamp':t,
                        'logs':[{'message':[m]} for m in markers],
                        'exceptions':exceptions or [],'outcome':outcome}
            one = item(1000,[INITIAL,RESTART])
            two = item(2000,[FINAL,PERSIST])
            dumps=lambda x:json.dumps(x,indent=4)
            cases=[
                ('pretty_json_two_events',dumps(one)+'\n'+dumps(two),'PASS'),
                ('ndjson_two_events',json.dumps(one)+'\n'+json.dumps(two),'PASS'),
                ('pretty_json_null_event_and_script',dumps(one)+'\n'+dumps(two)+'\n','PASS'),
                ('one_event_only',dumps(one),'NOT_VERIFIED'),
                ('same_timestamp',dumps(one)+dumps(item(1000,[FINAL,PERSIST])),'NOT_VERIFIED'),
                ('missing_persistence',dumps(one)+dumps(item(2000,[FINAL])),'NOT_VERIFIED'),
                ('failure_marker',dumps(one)+dumps(two)+dumps(item(3000,['R3_SCHEDULED_FAILURE=YES'])),'BLOCKED'),
                ('foreign_worker',dumps(one)+dumps(item(1500,[],script='wrong'))+dumps(two),'BLOCKED'),
                ('wrong_cron',dumps(one)+dumps(item(2000,[FINAL,PERSIST],event={'cron':'0 * * * *'})),'NOT_VERIFIED'),
                ('missing_outcome',dumps(one)+dumps(item(2000,[FINAL,PERSIST],outcome='exception')),'NOT_VERIFIED'),
                ('extraneous_non_json',dumps(one)+'tail terminal banner\n'+dumps(two),'BLOCKED'),
                ('trailing_partial_after_two_complete',dumps(one)+dumps(two)+'\n{"unfinished":','PASS'),
                ('trailing_partial_after_one',dumps(one)+'\n{"unfinished":','NOT_VERIFIED'),
                ('empty', '', 'NOT_VERIFIED'),
            ]
            failures=[]
            for name,source,expected in cases:
                got,_,_=check_evidence(source,W)
                if got!=expected:
                    failures.append(f'{name}:{got}!={expected}')
            # Also test unsafe worker name and too-large input.
            if check_evidence(dumps(one)+dumps(two),'production-witness')[0]!='BLOCKED':
                failures.append('unsafe_worker')
            if check_evidence('x'*(MAX_BYTES+1),W)[0]!='BLOCKED':
                failures.append('oversize')
            total=len(cases)+2
            print(f'R5_STREAM_PARSER_OFFLINE_TESTS={total};PASS={total-len(failures)};FAIL={len(failures)}')
            print('GITHUB_WRITE=NO;CLOUDFLARE_MUTATIONS=0;LIVE_ACCEPTANCE=NOT_VERIFIED')
