name: Maintenance Cleanup

on:
  workflow_dispatch:

  schedule:
    - cron: "17 3 * * *"

  workflow_run:
    workflows:
      - "AppForge Android Debug"
      - "AppForge Conversion Smoke"
    types:
      - completed

permissions:
  contents: read
  actions: write

concurrency:
  group: appforge-maintenance-cleanup
  cancel-in-progress: false

jobs:

  cleanup-github:
    name: Keep last 5 GitHub runs
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Cleanup all GitHub workflows
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo " GitHub Actions otomatik temizlik"
          echo " Her workflow için son 5 tamamlanan run"
          echo "======================================"

          WORKFLOWS_FILE="$(mktemp)"

          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
            --jq '.workflows[] | [.id, .name] | @tsv' \
            > "$WORKFLOWS_FILE"

          while IFS=$'\t' read -r WORKFLOW_ID WORKFLOW_NAME
          do
              [ -z "$WORKFLOW_ID" ] && continue

              echo
              echo "▶ $WORKFLOW_NAME"

              RUNS_FILE="$(mktemp)"

              gh api --paginate \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs?per_page=100" \
                --jq '.workflow_runs[] | select(.status == "completed") | .id' \
                > "$RUNS_FILE"

              TOTAL="$(
                wc -l < "$RUNS_FILE" |
                tr -d ' '
              )"

              echo "Tamamlanan run sayısı: $TOTAL"

              if [ "$TOTAL" -gt 5 ]
              then
                  DELETE_COUNT=$((TOTAL - 5))

                  echo "Silinecek: $DELETE_COUNT"
                  echo "Korunacak: 5"

                  tail -n +6 "$RUNS_FILE" |
                  while read -r RUN_ID
                  do
                      [ -z "$RUN_ID" ] && continue

                      echo "  Siliniyor: $RUN_ID"

                      DELETE_ERR="$(mktemp)"

                      if ! gh api \
                        --method DELETE \
                        "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
                        2>"$DELETE_ERR"
                      then
                          if grep -q "HTTP 404" "$DELETE_ERR"
                          then
                              echo "  Zaten silinmiş: $RUN_ID"
                          else
                              echo "  Silme hatası: $RUN_ID"
                              cat "$DELETE_ERR" >&2
                              rm -f "$DELETE_ERR"
                              exit 1
                          fi
                      fi

                      rm -f "$DELETE_ERR"
                  done
              else
                  echo "Temizlik gerekmiyor."
              fi

              rm -f "$RUNS_FILE"

          done < "$WORKFLOWS_FILE"

          rm -f "$WORKFLOWS_FILE"

          echo
          echo "GitHub Actions temizliği tamamlandı."


  cleanup-railway:
    name: Keep last 5 + latest Railway success
    runs-on: ubuntu-latest

    env:
      RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}

    steps:
      - name: Cleanup Railway deployment history
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${RAILWAY_PROJECT_TOKEN:-}" ]
          then
              echo "RAILWAY_PROJECT_TOKEN tanımlı değil."
              echo "Railway temizliği atlandı."
              exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          import time
          import subprocess

          API = "https://backboard.railway.com/graphql/v2"

          TOKEN = os.environ.get(
              "RAILWAY_PROJECT_TOKEN",
              ""
          ).strip()

          if not TOKEN:
              print(
                  "RAILWAY_PROJECT_TOKEN yok. "
                  "Railway temizliği atlandı."
              )
              raise SystemExit(0)


          def graphql(
              query,
              variables=None
          ):
              payload = json.dumps(
                  {
                      "query": query,
                      "variables": variables or {}
                  }
              )

              result = subprocess.run(
                  [
                      "curl",
                      "--silent",
                      "--show-error",
                      "--fail-with-body",
                      "--request",
                      "POST",
                      "--url",
                      API,
                      "--header",
                      f"Project-Access-Token: {TOKEN}",
                      "--header",
                      "Content-Type: application/json",
                      "--header",
                      "Accept: application/json",
                      "--header",
                      "User-Agent: AppForge-Maintenance/1.0",
                      "--data-binary",
                      payload
                  ],
                  capture_output=True,
                  text=True
              )

              if result.returncode != 0:
                  raise RuntimeError(
                      "Railway API hatası: " +
                      (
                          result.stderr.strip() or
                          result.stdout.strip()
                      )
                  )

              try:
                  response = json.loads(
                      result.stdout
                  )
              except Exception:
                  raise RuntimeError(
                      "Railway geçersiz yanıt verdi: " +
                      result.stdout[:500]
                  )

              if response.get("errors"):
                  raise RuntimeError(
                      "Railway GraphQL hatası: " +
                      json.dumps(
                          response["errors"],
                          ensure_ascii=False
                      )
                  )

              return response.get(
                  "data",
                  {}
              )

          context = graphql(
              """
              query {
                projectToken {
                  projectId
                  environmentId
                }
              }
              """
          ).get(
              "projectToken"
          )

          if not context:
              raise RuntimeError(
                  "Railway Project Token bilgileri alınamadı."
              )

          project_id = context["projectId"]
          environment_id = context["environmentId"]

          project_data = graphql(
              """
              query ProjectServices(
                $id: String!
              ) {
                project(
                  id: $id
                ) {
                  id
                  name

                  services {
                    edges {
                      node {
                        id
                        name
                      }
                    }
                  }
                }
              }
              """,
              {
                  "id": project_id
              }
          )

          project = project_data.get(
              "project"
          )

          if not project:
              raise RuntimeError(
                  "Railway projesi bulunamadı."
              )

          services = [
              edge["node"]
              for edge
              in project
                  .get(
                      "services",
                      {}
                  )
                  .get(
                      "edges",
                      []
                  )
          ]

          print(
              f"Railway proje: "
              f"{project.get('name', project_id)}"
          )

          print(
              f"Servis sayısı: {len(services)}"
          )

          CLEANABLE_OLD_STATUSES = {
              "SUCCESS",
              "FAILED",
              "CRASHED",
              "SKIPPED"
          }

          ACTIVE_STATUSES = {
              "BUILDING",
              "DEPLOYING",
              "INITIALIZING",
              "WAITING",
              "QUEUED",
              "SLEEPING"
          }

          deployments_query = """
          query Deployments(
            $projectId: String!,
            $serviceId: String!,
            $environmentId: String!
          ) {
            deployments(
              first: 100,
              input: {
                projectId: $projectId,
                serviceId: $serviceId,
                environmentId: $environmentId
              }
            ) {
              edges {
                node {
                  id
                  status
                  createdAt
                }
              }
            }
          }
          """

          remove_mutation = """
          mutation RemoveDeployment(
            $id: String!
          ) {
            deploymentRemove(
              id: $id
            )
          }
          """

          total_removed = 0

          for service in services:

              service_id = service["id"]

              service_name = service.get(
                  "name",
                  service_id
              )

              print()
              print(
                  f"▶ Railway servis: "
                  f"{service_name}"
              )

              data = graphql(
                  deployments_query,
                  {
                      "projectId":
                          project_id,

                      "serviceId":
                          service_id,

                      "environmentId":
                          environment_id
                  }
              )

              deployments = [
                  edge["node"]
                  for edge
                  in data
                      .get(
                          "deployments",
                          {}
                      )
                      .get(
                          "edges",
                          []
                      )
              ]

              deployments.sort(
                  key=lambda item:
                      item.get(
                          "createdAt",
                          ""
                      ),
                  reverse=True
              )

              print(
                  "Deployment sayısı:",
                  len(deployments)
              )

              #
              # En yeni 5 deployment
              # kesinlikle korunur.
              #
              newest = deployments[:5]
              old = deployments[5:]

              newest_ids = {
                  item["id"]
                  for item in newest
              }

              latest_success = next(
                  (
                      item
                      for item in deployments
                      if (
                          item.get(
                              "status",
                              ""
                          ).upper()
                          == "SUCCESS"
                      )
                  ),
                  None
              )

              backup_success_id = None

              if latest_success:
                  success_id = latest_success["id"]

                  if success_id not in newest_ids:
                      backup_success_id = success_id

                      print(
                          "Ek yedek SUCCESS korunuyor:",
                          backup_success_id
                      )
                  else:
                      print(
                          "En güncel SUCCESS zaten son 5 içinde:",
                          success_id
                      )
              else:
                  print(
                      "SUCCESS deployment bulunamadı; "
                      "ek yedek yok."
                  )

              print(
                  "Korunan son deployment:",
                  len(newest)
              )

              for deployment in old:

                  deployment_id = (
                      deployment["id"]
                  )

                  status = (
                      deployment
                      .get(
                          "status",
                          ""
                      )
                      .upper()
                  )

                  #
                  # Son 5'in dışında olsa bile en güncel
                  # başarılı deployment yedek olarak korunur.
                  #
                  if (
                      backup_success_id
                      and
                      deployment_id == backup_success_id
                  ):
                      print(
                          "  YEDEK SUCCESS KORUNDU:",
                          deployment_id
                      )
                      continue

                  #
                  # Çalışan veya potansiyel olarak
                  # aktif deploylara asla dokunma.
                  #
                  if status in ACTIVE_STATUSES:
                      print(
                          "  AKTİF KORUNDU:",
                          deployment_id,
                          status
                      )

                      continue

                  if status == "REMOVED":
                      print(
                          "  REMOVED - ATLANDI:",
                          deployment_id
                      )
                      continue

                  if (
                      status
                      not in
                      CLEANABLE_OLD_STATUSES
                  ):
                      print(
                          "  BİLİNMEYEN DURUM - ATLANDI:",
                          deployment_id,
                          status
                      )

                      continue

                  try:
                      graphql(
                          remove_mutation,
                          {
                              "id":
                                  deployment_id
                          }
                      )

                      total_removed += 1

                      print(
                          "  TEMİZLENDİ:",
                          deployment_id,
                          status
                      )

                      #
                      # API'ye gereksiz yük bindirme.
                      #
                      time.sleep(
                          0.20
                      )

                  except Exception as exc:

                      #
                      # Tek bir eski deploy temizlenemezse
                      # diğer servislerin bakımını bozma.
                      #
                      print(
                          "  UYARI:",
                          deployment_id,
                          status,
                          str(exc)
                      )


          print()
          print(
              "Railway temizliği tamamlandı."
          )

          print(
              "Temizlenen eski deployment:",
              total_removed
          )

          #
          # İkinci doğrulama:
          # En yeni 5 dışındaki deploymentlar artık
          # tamamlanmış/temizlenebilir durumda kalmamalı.
          #
          print()
          print("Railway son kontrol başlıyor...")

          verification_failed = False

          for service in services:

              service_id = service["id"]

              service_name = service.get(
                  "name",
                  service_id
              )

              verify_data = graphql(
                  deployments_query,
                  {
                      "projectId":
                          project_id,

                      "serviceId":
                          service_id,

                      "environmentId":
                          environment_id
                  }
              )

              verify_deployments = [
                  edge["node"]
                  for edge
                  in verify_data
                      .get(
                          "deployments",
                          {}
                      )
                      .get(
                          "edges",
                          []
                      )
              ]

              verify_deployments.sort(
                  key=lambda item:
                      item.get(
                          "createdAt",
                          ""
                      ),
                  reverse=True
              )

              verify_newest = (
                  verify_deployments[:5]
              )

              old_verify = (
                  verify_deployments[5:]
              )

              verify_newest_ids = {
                  item["id"]
                  for item in verify_newest
              }

              verify_latest_success = next(
                  (
                      item
                      for item in verify_deployments
                      if (
                          item.get(
                              "status",
                              ""
                          ).upper()
                          == "SUCCESS"
                      )
                  ),
                  None
              )

              verify_backup_success_id = None

              if verify_latest_success:
                  verify_success_id = (
                      verify_latest_success["id"]
                  )

                  if (
                      verify_success_id
                      not in verify_newest_ids
                  ):
                      verify_backup_success_id = (
                          verify_success_id
                      )

              remaining_old = []

              for deployment in old_verify:

                  status = (
                      deployment
                      .get(
                          "status",
                          ""
                      )
                      .upper()
                  )

                  deployment_id = (
                      deployment["id"]
                  )

                  if (
                      verify_backup_success_id
                      and
                      deployment_id
                      == verify_backup_success_id
                      and
                      status == "SUCCESS"
                  ):
                      continue

                  if status in CLEANABLE_OLD_STATUSES:
                      remaining_old.append(
                          deployment
                      )

              if remaining_old:

                  verification_failed = True

                  print(
                      f"❌ {service_name}: "
                      f"{len(remaining_old)} eski "
                      "deployment temizlenmemiş."
                  )

                  for deployment in remaining_old[:10]:
                      print(
                          "   ",
                          deployment.get("id"),
                          deployment.get("status")
                      )

              else:

                  recent_count = min(
                      5,
                      len(verify_deployments)
                  )

                  print(
                      f"✅ {service_name}: "
                      f"son {recent_count} korunuyor, "
                      "eski tamamlanmış deployment kalmadı."
                  )


          if verification_failed:
              raise RuntimeError(
                  "Railway doğrulaması başarısız: "
                  "temizlenmemiş eski deployment var."
              )

          print()
          print(
              "✅ Railway doğrulaması başarılı."
          )
          PY
