name: Maintenance Cleanup

on:
  workflow_dispatch:

  schedule:
    - cron: "17 3 * * *"

  workflow_run:
    workflows:
      - "AppForge Android Debug"
      - "AppForge Conversion Smoke"
    types:
      - completed

permissions:
  contents: read
  actions: write

concurrency:
  group: appforge-maintenance-cleanup
  cancel-in-progress: false

jobs:

  cleanup-github:
    name: Keep last 5 GitHub runs
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Cleanup all GitHub workflows
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo " GitHub Actions otomatik temizlik"
          echo " Her workflow için son 5 tamamlanan run"
          echo "======================================"

          WORKFLOWS_FILE="$(mktemp)"

          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
            --jq '.workflows[] | [.id, .name] | @tsv' \
            > "$WORKFLOWS_FILE"

          while IFS=$'\t' read -r WORKFLOW_ID WORKFLOW_NAME
          do
              [ -z "$WORKFLOW_ID" ] && continue

              echo
              echo "▶ $WORKFLOW_NAME"

              RUNS_FILE="$(mktemp)"

              gh api --paginate \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs?per_page=100" \
                --jq '.workflow_runs[] | select(.status == "completed") | .id' \
                > "$RUNS_FILE"

              TOTAL="$(
                wc -l < "$RUNS_FILE" |
                tr -d ' '
              )"

              echo "Tamamlanan run sayısı: $TOTAL"

              if [ "$TOTAL" -gt 5 ]
              then
                  DELETE_COUNT=$((TOTAL - 5))

                  echo "Silinecek: $DELETE_COUNT"
                  echo "Korunacak: 5"

                  tail -n +6 "$RUNS_FILE" |
                  while read -r RUN_ID
                  do
                      [ -z "$RUN_ID" ] && continue

                      echo "  Siliniyor: $RUN_ID"

                      DELETE_ERR="$(mktemp)"

                      if ! gh api \
                        --method DELETE \
                        "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
                        2>"$DELETE_ERR"
                      then
                          if grep -q "HTTP 404" "$DELETE_ERR"
                          then
                              echo "  Zaten silinmiş: $RUN_ID"
                          else
                              echo "  Silme hatası: $RUN_ID"
                              cat "$DELETE_ERR" >&2
                              rm -f "$DELETE_ERR"
                              exit 1
                          fi
                      fi

                      rm -f "$DELETE_ERR"
                  done
              else
                  echo "Temizlik gerekmiyor."
              fi

              rm -f "$RUNS_FILE"

          done < "$WORKFLOWS_FILE"

          rm -f "$WORKFLOWS_FILE"

          echo
          echo "GitHub Actions temizliği tamamlandı."
