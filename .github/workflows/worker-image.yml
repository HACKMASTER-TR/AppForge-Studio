name: Build AppForge Worker Image

on:
  push:
    branches:
      - main
    paths:
      - "build-service/**"
      - ".github/workflows/worker-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: appforge-worker-image
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/hackmaster-tr/appforge-worker

jobs:
  build-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Worker dependencies
        working-directory: ./build-service
        run: npm install

      - name: Run full regression suite
        working-directory: ./build-service
        run: npm test

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Worker image
        uses: docker/build-push-action@v6
        with:
          context: ./build-service
          file: ./build-service/Dockerfile.worker
          push: true
          build-args: |
            ANDROID_SDK_LICENSE_ACCEPTED=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
