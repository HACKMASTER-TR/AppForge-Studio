           ('    const admin=await verifyGoogleAdminIdToken(',"    mark('OIDC_VERIFY_ID_TOKEN');\n    const admin=await verifyGoogleAdminIdToken(",'OIDC_VERIFY'),
           ('    this.#nonces.consume(sessionId,nonce);',"    mark('OIDC_NONCE_CONSUME');\n    this.#nonces.consume(sessionId,nonce);",'NONCE_CONSUME'),
           ('    const state=this.#registry.snapshot(',"    mark('OIDC_REGISTRY_SNAPSHOT');\n    const state=this.#registry.snapshot(",'REGISTRY_SNAPSHOT'),
