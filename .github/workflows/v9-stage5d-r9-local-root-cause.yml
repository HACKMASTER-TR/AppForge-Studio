           ("    try { pub=await crypto.subtle.importKey('spki'", "    mark('ENROLL_IMPORT_P256');\n    try { pub=await crypto.subtle.importKey('spki'",'ENROLL_IMPORT'),
           ("    const deviceId=hex(new Uint8Array(await crypto.subtle.digest('SHA-256',der)));", "    mark('ENROLL_SHA256');\n    const deviceId=hex(new Uint8Array(await crypto.subtle.digest('SHA-256',der)));",'ENROLL_HASH'),
           ("    return this.s.transactionSync(()=>{\n      demand(!this.s.kv.get(enState(deviceId))", "    mark('ENROLL_CHALLENGE_TRANSACTION');\n    return this.s.transactionSync(()=>{\n      demand(!this.s.kv.get(enState(deviceId))",'ENROLL_TX'),
           ('    const c=this.s.kv.get(enChallenge(proof.deviceId));',"    mark('ENROLL_CHALLENGE_READ');\n    const c=this.s.kv.get(enChallenge(proof.deviceId));",'ENROLL_READ'),
           ('    const verified=await verifyDeviceProof(',"    mark('ENROLL_PROOF_VERIFY');\n    const verified=await verifyDeviceProof(",'ENROLL_PROOF_VERIFY'),
           ('    const requestId=this.random();',"    mark('ENROLL_REQUEST_RANDOM');\n    const requestId=this.random();",'ENROLL_REQUEST_RANDOM'),
           ("    return this.s.transactionSync(()=>{\n      const latest=this.s.kv.get(enChallenge(verified.deviceId));", "    mark('ENROLL_REQUEST_TRANSACTION');\n    return this.s.transactionSync(()=>{\n      const latest=this.s.kv.get(enChallenge(verified.deviceId));",'ENROLL_REQUEST_TX'),
           ('    const expectedPin=hex(new Uint8Array(await crypto.subtle.digest(',"    mark('PERMIT_ADMIN_PIN');\n    const expectedPin=hex(new Uint8Array(await crypto.subtle.digest(",'PERMIT_PIN'),
