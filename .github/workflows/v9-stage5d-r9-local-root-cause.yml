          ])
          # R9 entry exists only in the ephemeral runner folder. No public routes and no live bindings.
          (dst/'stage5d-r3-probe'/'r9-entry.mjs').write_text(r'''import {DurableObject} from 'cloudflare:workers';
          import {V9Stage5DProbeCore} from '../stage5d-probe/core.mjs';
          import {getMark,resetMark} from '../stage5d-probe/r9-marker.mjs';
          import {runR3Scheduled} from './scheduled.mjs';
          const doName='stage5d-r3-disposable-private-do-20261029';
          const allowed=new Set(['Error','TypeError','OperationError','NotSupportedError','DataError','InvalidAccessError','InvalidStateError','QuotaExceededError','SyntaxError','UnknownError']);
          export class V9Stage5DR9DO extends DurableObject {
            constructor(ctx,env){super(ctx,env);this.core=new V9Stage5DProbeCore(ctx.storage,crypto.randomUUID());}
            async exercise(){resetMark();try{return await this.core.exercise();}catch(e){
              const stage=getMark(),raw=String(e?.name||'Error'),errorClass=allowed.has(raw)?raw:'OtherError';
              this.ctx.storage.kv.put('r9:diag',{stage,errorClass});
              throw new Error('R9_EXERCISE_BLOCKED');
            }}
            inspectRestart(){return this.core.inspectRestart();}
            getPhase(){return this.ctx.storage.kv.get('stage5d:checkpoint')?.phase??'empty';}
            getDiag(){return this.ctx.storage.kv.get('r9:diag')??{stage:'NONE',errorClass:'NONE'};}
            abortInstance(){this.ctx.abort('R9_EXPECTED_RESTART',{retryAlarm:false});}
