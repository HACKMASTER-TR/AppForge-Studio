                return new Response('not exposed',{status:503,headers:{'cache-control':'no-store'}});
              const ns=env.V9_STAGE5D_R3_PROBE,stub=ns.get(ns.idFromName(doName));
              const [phase,diag]=await Promise.all([stub.getPhase(),stub.getDiag()]);
              const p=['empty','revoked'].includes(phase)?phase:'OTHER';
              const stage=/^[A-Z0-9_]{3,50}$/.test(diag.stage)?diag.stage:'UNKNOWN';
