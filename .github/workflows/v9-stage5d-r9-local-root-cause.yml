           ('    const approved=await service.decideDevice(',"    mark('ADMIN_APPROVE');\n    const approved=await service.decideDevice(",'ADMIN_APPROVE'),
           ("    insist(approved.status==='active'", "    mark('APPROVE_ASSERT');\n    insist(approved.status==='active'",'APPROVE_ASSERT'),
           ('    const actionChallenge=service.beginAuthorizedChallenge(',"    mark('AUTH_CHALLENGE_ISSUE');\n    const actionChallenge=service.beginAuthorizedChallenge(",'CHALLENGE'),
           ('    const actionProof=await makeDeviceProof(',"    mark('AUTH_CHALLENGE_SIGN');\n    const actionProof=await makeDeviceProof(",'CHALLENGE_SIGN'),
           ('    const accepted=await service.verifyAuthorizedProof(',"    mark('AUTH_CHALLENGE_VERIFY');\n    const accepted=await service.verifyAuthorizedProof(",'CHALLENGE_VERIFY'),
           ("    insist(accepted.authenticated===true", "    mark('AUTHORIZED_ASSERT');\n    insist(accepted.authenticated===true",'AUTH_ASSERT'),
           ('    let replayDenied=false;',"    mark('REPLAY_DENY');\n    let replayDenied=false;",'REPLAY'),
           ('    const revokedSession=service.beginAdminSession(),revJwt=await fixtureJwt(ga,revokedSession.nonce,this.clock());',
            "    mark('OIDC_SESSION_REVOKE');const revokedSession=service.beginAdminSession();\n    mark('OIDC_JWT_REVOKE');const revJwt=await fixtureJwt(ga,revokedSession.nonce,this.clock());",'OIDC_REVOKE'),
           ('    const revoked=await service.decideDevice(',"    mark('ADMIN_REVOKE');\n    const revoked=await service.decideDevice(",'ADMIN_REVOKE'),
           ("    insist(revoked.status==='revoked'", "    mark('REVOKE_ASSERT');\n    insist(revoked.status==='revoked'",'REVOKE_ASSERT'),
           ("    let blocked=false;try{service.beginAuthorizedChallenge({deviceId:req.deviceId,operation:'receipt'});}catch{blocked=true;}","    mark('REVOKED_CHALLENGE_DENY');\n    let blocked=false;try{service.beginAuthorizedChallenge({deviceId:req.deviceId,operation:'receipt'});}catch{blocked=true;}",'REVOKED_DENY'),
           ("    this.storage.kv.put('stage5d:checkpoint'", "    mark('CHECKPOINT_WRITE');\n    this.storage.kv.put('stage5d:checkpoint'",'CHECKPOINT_WRITE'),
          ])
          # Workerd-only synthetic fixture repair: use an explicit public JWK allowlist.
          # The repository's core.mjs and strict OIDC verifier remain untouched.
          fixture_path=dst/'stage5d-probe'/'core.mjs'
          fixture_source=fixture_path.read_text()
          fixture_old="  const jwk={...pub,alg:'RS256',use:'sig',kid:'stage5d-issuer-test'};"
          fixture_new="  const jwk={kty:pub.kty,n:pub.n,e:pub.e,alg:'RS256',use:'sig',kid:'stage5d-issuer-test'};"
          assert fixture_source.count(fixture_old)==1, 'R9_FIXTURE_JWK_ANCHOR_DRIFT'
          fixture_path.write_text(fixture_source.replace(fixture_old,fixture_new,1))
          print('R9_SYNTHETIC_JWKS_PUBLIC_ONLY=PASS;EPHEMERAL_COPY=YES;ORIGINAL_SOURCE_UNCHANGED=YES')
          edit('device-auth/protocol.mjs',[
