          LOG="$RUNNER_TEMP/r9-workerd-private.log"
          start_runtime() {
            setsid npx --yes wrangler@4.153.0 dev --local --test-scheduled --config "$R9_CONFIG_PATH" --ip 127.0.0.1 --port "$PORT" --persist-to "$STATE" --log-level info --show-interactive-dev-session=false > "$LOG" 2>&1 &
            PGID=$!
          }
          stop_runtime() {
            kill -- -"$PGID" 2>/dev/null || true
            wait "$PGID" 2>/dev/null || true
            sleep 2
          }
          cleanup() { if [[ -n "${PGID:-}" ]]; then stop_runtime; fi; }
          trap cleanup EXIT
          start_runtime
          python3 - <<'PY'
          import urllib.request, urllib.error, time, json,sys
          root='http://127.0.0.1:8799'
          def get(path,header=False,timeout=60):
           req=urllib.request.Request(root+path,headers={'x-r9-loopback':'LOCAL_ONLY'} if header else {})
           try:
            with urllib.request.urlopen(req,timeout=timeout) as response:return response.status,response.read(16384)
           except urllib.error.HTTPError as ex:return ex.code,ex.read(16384)
          for _ in range(80):
           try:
            code,_=get('/',timeout=1)
            if code==503:break
            raise RuntimeError('R9_DENY_FAILED')
           except (TimeoutError,urllib.error.URLError):time.sleep(1)
          else:raise RuntimeError('R9_WORKER_NOT_READY')
          c,_=get('/__r9_diag')
          if c!=503:raise RuntimeError('R9_DIAG_NOT_DENIED')
          c,raw=get('/cdn-cgi/local/scheduled?cron=%2A+%2A+%2A+%2A+%2A&format=json',timeout=90)
          try:out=json.loads(raw).get('outcome','unknown')
          except:out='unknown'
          c,raw=get('/__r9_diag',True)
          if c!=200:raise RuntimeError('R9_DIAG_UNAVAILABLE')
          data=json.loads(raw);r=data['run']
          print('R9_FIRST_OUTCOME='+str(out))
          print('R9_FIRST_STAGE='+str(data['stage']))
          print('R9_FIRST_ERROR_CLASS='+str(data['errorClass']))
          print('R9_FIRST_CHECKPOINT='+str(data['phase']))
          print('R9_FIRST_RECEIVED='+str(r['received']))
          print('R9_FIRST_INITIAL='+str(r['initial']))
          print('R9_FIRST_RESTART_REQUESTED='+str(r['restartRequested']))
          if not(r['reached'] and r['received'] and r['initial'] and r['restartRequested'] and r['result']=='OK' and data['phase']=='revoked'):
           print('R9_ROOT_CAUSE_DIAGNOSIS=REQUIRES_FIX;LIVE_ACCEPTANCE=NOT_VERIFIED')
           sys.exit(1)
          print('R9_FIRST_PHASE=PASS')
          PY
          stop_runtime
          PGID=''
          start_runtime
          python3 - <<'PY'
          import urllib.request,urllib.error,time,json,sys
          root='http://127.0.0.1:8799'
          def get(path,headers=None,timeout=60):
           req=urllib.request.Request(root+path,headers=headers or {})
           try:
            with urllib.request.urlopen(req,timeout=timeout) as x:return x.status,x.read(16384)
           except urllib.error.HTTPError as e:return e.code,e.read(16384)
          for _ in range(80):
           try:
            code,_=get('/',timeout=1)
            if code==503:break
            raise RuntimeError('R9_RESTART_DENY_FAILED')
           except (TimeoutError,urllib.error.URLError):time.sleep(1)
          else:raise RuntimeError('R9_RESTART_NOT_READY')
          code,raw=get('/__r9_diag',{'x-r9-loopback':'LOCAL_ONLY'})
          if code!=200 or json.loads(raw)['phase']!='revoked':
           print('R9_PROCESS_RESTART_PERSISTENCE=FAIL');sys.exit(1)
          get('/cdn-cgi/local/scheduled?cron=%2A+%2A+%2A+%2A+%2A&format=json',timeout=90)
          code,raw=get('/__r9_diag',{'x-r9-loopback':'LOCAL_ONLY'})
          if code!=200:raise RuntimeError('R9_SECOND_DIAG_UNAVAILABLE')
          data=json.loads(raw);r=data['run']
          print('R9_SECOND_CHECKPOINT='+str(data['phase']))
          print('R9_SECOND_RESULT='+str(r['result']))
          print('R9_SECOND_PERSISTENCE='+str(r['persistence']))
          print('R9_SECOND_FINAL='+str(r['final']))
          if not (r['received'] and r['persistence'] and r['final'] and r['result']=='OK' and data['phase']=='revoked'):
           print('R9_ACCEPTANCE=FAIL;LIVE_ACCEPTANCE=NOT_VERIFIED');sys.exit(1)
          print('R9_LOCAL_WORKERD_ACCEPTANCE=PASS;RESTART=PASS;PERSISTENCE=PASS;DENY=PASS')
          print('R9_LIVE_ACCEPTANCE=NOT_VERIFIED;CLOUDFLARE_DEPLOY=NO')
          PY
