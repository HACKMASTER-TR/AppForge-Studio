           ("  const pin=hex(new Uint8Array(await crypto.subtle.digest('SHA-256',der)));","  mark('PROOF_SHA256');\n  const pin=hex(new Uint8Array(await crypto.subtle.digest('SHA-256',der)));",'PROOF_HASH'),
           ("  try {pub=await crypto.subtle.importKey('spki'", "  mark('PROOF_IMPORT_P256');\n  try {pub=await crypto.subtle.importKey('spki'",'PROOF_IMPORT'),
           ('  const sig=derToP1363(',"  mark('PROOF_DER_TO_P1363');\n  const sig=derToP1363(",'PROOF_DER'),
