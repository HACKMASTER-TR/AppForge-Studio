                  if(msg.startsWith('R3_RESTART_REQUESTED=YES'))r.restartRequested=true;
                  if(msg==='R3_RESTART_PERSISTENCE=PASS')r.persistence=true;
                  if(msg.startsWith('V9_STAGE5D_R3_LIVE=PASS'))r.final=true;
