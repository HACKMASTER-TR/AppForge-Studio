           s=p.read_text()
           if part.startswith('stage5d-probe/'):
            s="import {mark} from './r9-marker.mjs';\n"+s
           else:
            s="import {mark} from '../stage5d-probe/r9-marker.mjs';\n"+s
           for anchor, code, label in insertions:
            assert s.count(anchor)==1, 'R9_INSTRUMENTATION_ANCHOR_DRIFT:'+label
            s=s.replace(anchor,code,1)
           p.write_text(s)
          edit('stage5d-probe/core.mjs',[
           ("  const pub=await crypto.subtle.exportKey('jwk',key.publicKey);", "  mark('JWT_EXPORT_JWK');\n  const pub=await crypto.subtle.exportKey('jwk',key.publicKey);",'JWT_EXPORT'),
           ("  const signature=await crypto.subtle.sign('RSASSA-PKCS1-v1_5'", "  mark('JWT_RSA_SIGN');\n  const signature=await crypto.subtle.sign('RSASSA-PKCS1-v1_5'",'JWT_RSA_SIGN'),
