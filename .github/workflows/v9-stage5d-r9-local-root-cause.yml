           ("    const adminPin=hex(await crypto.subtle.digest('SHA-256',adminSpki));", "    mark('ADMIN_PIN_SHA256');\n    const adminPin=hex(await crypto.subtle.digest('SHA-256',adminSpki));",'ADMIN_PIN'),
           ("    const pubFixture=await fixtureJwt(ga,'placeholder',this.clock());", "    mark('RSA_JWT_FIXTURE');\n    const pubFixture=await fixtureJwt(ga,'placeholder',this.clock());",'RSA_FIXTURE'),
           ('    const service=new V9PrivateDeviceAdminService(',"    mark('PRIVATE_SERVICE_INIT');\n    const service=new V9PrivateDeviceAdminService(",'SERVICE'),
