# Local-only R9 evidence. No push/merge/deploy in this workflow.
name: V9 Stage5D R9 Local Workerd Root Cause (No Deploy)
'on':
  push:
    branches:
      - feat/v9-global-package-distribution-20261027
    paths:
      - .github/workflows/v9-stage5d-r9-local-root-cause.yml
permissions:
  contents: read
concurrency:
  group: v9-stage5d-r9-local-only
  cancel-in-progress: false
jobs:
  r9-workerd-root-cause:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_SEND_METRICS: 'false'
      EXPECTED_PARENT: 41ff373e29fff526b6518f13ea40679323badce7
      R9_WORKFLOW: .github/workflows/v9-stage5d-r9-local-root-cause.yml
    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact one-file R9 scope and source pins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess
          g=lambda *a: subprocess.check_output(['git',*a],text=True).strip()
          assert g('rev-parse','HEAD^')==os.environ['EXPECTED_PARENT'],'PARENT_CHANGED'
          assert g('diff-tree','--no-commit-id','--name-only','-r','HEAD').splitlines()==[os.environ['R9_WORKFLOW']],'R9_SCOPE_CHANGED'
          pins={
           'cloudflare/v9-witness/stage5d-r3-probe/entry.mjs':'a13bfba95f5a848cc1a7a58aee7f20b22bbcde04',
           'cloudflare/v9-witness/stage5d-r3-probe/scheduled.mjs':'e5bff1fd72abaca6e9159d8d8b674c830fb535f1',
           'cloudflare/v9-witness/stage5d-r3-probe/wrangler.toml':'fe743d26ea110f9f2a05a00353607cab21b17137',
           'cloudflare/v9-witness/stage5d-probe/core.mjs':'97c387597cdaf3d34bbad9c106d3fc4ed59681c6',
           'cloudflare/v9-witness/device-auth/stage5d-private.mjs':'537d8167550aca3eebc5de87299efb46b2ff12c7'}
          for p,sha in pins.items():
           assert g('rev-parse','HEAD:'+p)==sha,'R9_SOURCE_PIN_DRIFT'
          print('R9_PREFLIGHT=PASS;ONE_WORKFLOW_ONLY=YES;SOURCE_PIN=PASS')
          print('R9_REMOTE_DEPLOY=NO;GITHUB_WRITE=NO;PRODUCTION_SECRETS=NOT_USED')
          PY
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original Node regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --test cloudflare/v9-witness/stage5d-r3-probe/scheduled.test.mjs cloudflare/v9-witness/stage5d-probe/core.test.mjs > "$RUNNER_TEMP/r9-node-private.log" 2>&1
          echo 'R9_ORIGINAL_NODE_TESTS=PASS'
      - name: Create instrumented ephemeral copy only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, shutil, pathlib, tomllib
          src=pathlib.Path('cloudflare/v9-witness')
          dst=pathlib.Path(os.environ['RUNNER_TEMP'])/'r9-source'/'cloudflare'/'v9-witness'
          dst.mkdir(parents=True)
          for part in ('device-auth','stage5d-probe','stage5d-r3-probe'):
           shutil.copytree(src/part,dst/part)
          marker=dst/'stage5d-probe'/'r9-marker.mjs'
          marker.write_text('''let phase='BOOT';
          export function mark(tag){if(!/^[A-Z0-9_]{3,50}$/.test(tag))throw Error('R9_INVALID_MARKER');phase=tag;}
          export function getMark(){return phase;}
          export function resetMark(){phase='BOOT';}
          ''')
          def edit(part, insertions):
