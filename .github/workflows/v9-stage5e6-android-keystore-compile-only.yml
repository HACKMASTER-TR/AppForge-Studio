# V9 Stage 5E6: compile-only, no APK, no production signing, no deploy.
# This workflow cannot run until a separately approved V9-only commit is pushed.
name: V9 Stage 5E6 Android Keystore Compile Only
'on':
  push:
    branches:
      - feat/v9-global-package-distribution-20261027
    paths:
      - '.github/workflows/v9-stage5e6-android-keystore-compile-only.yml'
      - 'quality/v9-stage5e6-keystore-probe/**'
      - 'quality/tools/appforge_v9_stage5e6_preflight.py'
      - 'quality/tests/test_v9_stage5e6_contract.py'
      - 'docs/engineering/appforge-v9-stage5e6-keystore-acceptance.md'
permissions:
  contents: read
concurrency:
  group: v9-stage5e6-compile-only
  cancel-in-progress: false
jobs:
  android-keystore-compile-only:
    if: >-
      github.repository == 'HACKMASTER-TR/AppForge-Studio' &&
      github.ref == 'refs/heads/feat/v9-global-package-distribution-20261027' &&
      github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Exact scope, SHA256, no APK/no network permission preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 quality/tools/appforge_v9_stage5e6_preflight.py --repo . --ci
          python3 -B -m unittest discover -s quality/tests -p 'test_v9_stage5e6_contract.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing Stage 5A-5E5 Node security suite
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap \
            cloudflare/v9-witness/device-auth/protocol.test.mjs \
            cloudflare/v9-witness/device-auth/registry.test.mjs \
            cloudflare/v9-witness/device-auth/admin-oidc.test.mjs \
            cloudflare/v9-witness/stage5d-probe/core.test.mjs \
            cloudflare/v9-witness/device-auth/stage5e4-admin-gateway.test.mjs \
            cloudflare/v9-witness/device-auth/stage5e5-admin-proof.test.mjs > "$RUNNER_TEMP/v9-node.tap"
          python3 - <<'PY'
          from pathlib import Path
          s=Path(__import__('os').environ['RUNNER_TEMP'],'v9-node.tap').read_text()
          for name,num in [('tests',117),('pass',117),('fail',0),('skipped',0),('cancelled',0)]:
              assert f'# {name} {num}\n' in s, (name,num)
          print('S5E6_NODE_SECURITY=PASS;TESTS=117')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install matching Android SDK compile platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --channel=3 'platforms;android-37.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          test -s "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -s "$ANDROID_HOME/platforms/android-37/android.jar"
          echo 'S5E6_ANDROID_SDK=PASS;SDK=37;NDK=28.2.13676358'
      - name: Compile actual AppForge V9 Kotlin main and unit-test sources
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android-app :app:compileDebugKotlin :app:compileDebugUnitTestKotlin --no-daemon --stacktrace > "$RUNNER_TEMP/v9-app-compile.log" 2>&1 || {
            tail -n 120 "$RUNNER_TEMP/v9-app-compile.log"; exit 1;
          }
          grep -q 'BUILD SUCCESSFUL' "$RUNNER_TEMP/v9-app-compile.log"
          echo 'S5E6_APP_ANDROID_SDK_COMPILE=PASS;MAIN=PASS;TEST_SOURCES=PASS'
      - name: Compile isolated physical Keystore probe sources only
        shell: bash
        run: |
          set -euo pipefail
          R=quality/v9-stage5e6-keystore-probe
          S=android-app/app/src/main/java/com/appforge/studio/security
          D="$R/src/main/java/com/appforge/studio/security"
          mkdir -p "$D"
          for name in V9AdminProofWire.kt V9AdminP256SigningCore.kt V9AdminKeystoreRequestSigner.kt; do
            cp "$S/$name" "$D/$name"
            cmp "$S/$name" "$D/$name"
          done
          gradle -p "$R" :compileDebugKotlin --no-daemon --stacktrace > "$RUNNER_TEMP/v9-probe-compile.log" 2>&1 || {
            tail -n 120 "$RUNNER_TEMP/v9-probe-compile.log"; exit 1;
          }
          grep -q 'BUILD SUCCESSFUL' "$RUNNER_TEMP/v9-probe-compile.log"
          echo 'S5E6_PROBE_ANDROID_SDK_COMPILE=PASS;SIDE_CAR_UID=SEPARATE'
      - name: Deny APK production, signing, publication or side effects
        shell: bash
        run: |
          set -euo pipefail
          ! find android-app/app/build/outputs/apk quality/v9-stage5e6-keystore-probe/build/outputs/apk \
            -type f -name '*.apk' 2>/dev/null | grep -q .
          test -z "$(git diff --name-only)"
          echo 'S5E6_COMPILE_ACCEPTANCE=PASS;APK=NO;AAB=NO;SIGNING=NO;DEPLOY=NO;PRODUCTION=BLOCKED'
