name: AppForge V547 R17 Verified AGP Android Compile Only
on:
  push:
    branches:
      - codex/v547-android-compile-20261119-r17
permissions:
  contents: read
  actions: read
concurrency:
  group: v547-r17-android-compile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verified-agp-android-compile:
    if: github.repository == 'HACKMASTER-TR/AppForge-Studio'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GRADLE_USER_HOME: ${{ runner.temp }}/v547-r17-gradle
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Require R16 passing gates and exact seed provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          git merge-base --is-ancestor e38e2e78a5f553c587ea19d0396b1fde1f76bd20 HEAD
          repo=HACKMASTER-TR/AppForge-Studio
          for run in 44574472185 44574490996; do
            test "$(gh api "repos/$repo/actions/runs/$run" --jq .conclusion)" = success
            test "$(gh api "repos/$repo/actions/runs/$run" --jq .head_sha)" = e38e2e78a5f553c587ea19d0396b1fde1f76bd20
          done
          test "$(gh api "repos/$repo/actions/artifacts/14554148259" --jq .digest)" = sha256:fa745ccdf122f86d77d5b971d2c2db0300db2b77d8d0984ec9628cec67fe85c0
          test "$(gh api "repos/$repo/actions/artifacts/14554148259" --jq .expired)" = false
          echo APPFORGE_V547_R17_PROVENANCE=PASS
      - uses: actions/download-artifact@v4
        with:
          repository: HACKMASTER-TR/AppForge-Studio
          run-id: 44570760969
          name: v547-agp911-gradle931-ci-candidate-7d0994b6582a859c516967fd162fbd4e3d1b054a
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v547-r17-candidate
      - name: Verify all 471 AGP files into disposable Gradle cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GRADLE_USER_HOME"
          python3 quality/tools/v547_agp_arm64_candidate_probe.py \
            "$RUNNER_TEMP/v547-r17-candidate" "$GRADLE_USER_HOME/caches"
          echo APPFORGE_V547_R17_AGP_CACHE=VERIFIED
      - name: Verify AGP plugin offline from pinned cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v547-r17-plugin-proof"
          cd "$RUNNER_TEMP/v547-r17-plugin-proof"
          printf '%s\n' 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' 'rootProject.name = "R17OfflinePluginProof"' > settings.gradle.kts
          printf '%s\n' 'plugins { id("com.android.application") version "9.1.1" apply false }' > build.gradle.kts
          gradle --offline help --no-daemon --no-configuration-cache --console=plain
          echo APPFORGE_V547_R17_OFFLINE_AGP_RESOLUTION=PASS
      - name: Install pinned Android 37 NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$sdkmanager"
          "$sdkmanager" --channel=3 'platforms;android-37.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          test -s "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          test -d "$ANDROID_HOME/cmake/3.22.1"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          echo APPFORGE_V547_R17_ANDROID_TOOLCHAIN=VERIFIED
      - name: Compile project Kotlin Java and unit-test sources only
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android-app \
            :app:compileDebugKotlin \
            :app:compileDebugJavaWithJavac \
            :app:compileDebugUnitTestKotlin \
            -PappforgeCIMavenGcs=true \
            --no-daemon --no-parallel --no-configuration-cache --console=plain --stacktrace
          echo APPFORGE_V547_R17_ANDROID_COMPILE=PASS
      - name: Verify CI-only compile boundary and no APK
        shell: bash
        run: |
          set -euo pipefail
          if find android-app -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit | grep -q .; then
            echo APPFORGE_V547_R17_NO_APK=FAIL
            exit 1
          fi
          test -z "$(git status --porcelain --untracked-files=no)"
          echo APPFORGE_V547_R17_NO_APK=PASS
          echo APPFORGE_V547_R17_SIGNING=NOT_STARTED
          echo APPFORGE_V547_R17_DEVICE_INSTALL=NOT_STARTED
          echo APPFORGE_V547_R17_R2_CLOUDFLARE=UNTOUCHED
