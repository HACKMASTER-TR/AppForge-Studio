name: Build AppForge Source Worker Image

on:
  push:
    branches:
      - main
    paths:
      - "build-service/**"
      - ".github/workflows/source-worker-image.yml"
      - "!build-service/tests/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: appforge-source-worker-image
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/hackmaster-tr/appforge-source-worker
  LOCAL_IMAGE: appforge-source-worker:ci

jobs:
  build-source-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: build-service/package-lock.json

      - name: Install Worker dependencies
        working-directory: ./build-service
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Run source worker regression suite
        working-directory: ./build-service
        run: |
          node --test tests/source_build_isolation.test.js
          node --test tests/source_worker_contract.test.js
          node --test tests/source_worker_queue_routing.test.js
          node --test tests/source_worker_ci_contract.test.js
          node --test tests/technology_support_matrix.test.js

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image tag
        id: image-tag
        shell: bash
        run: echo "sha_tag=sha-${GITHUB_SHA::12}" >> "${GITHUB_OUTPUT}"

      - name: Build and publish immutable source Worker candidate
        uses: docker/build-push-action@v7
        with:
          context: ./build-service
          file: ./build-service/Dockerfile.source-worker
          load: false
          push: true
          provenance: false
          build-args: |
            ANDROID_SDK_LICENSE_ACCEPTED=true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.sha_tag }}
          cache-from: type=gha,scope=source-worker
          cache-to: type=gha,mode=min,scope=source-worker

      - name: Pull immutable source Worker candidate
        shell: bash
        run: |
          set -euo pipefail

          SHA_IMAGE="${IMAGE_NAME}:${{ steps.image-tag.outputs.sha_tag }}"

          docker pull "${SHA_IMAGE}"
          docker tag "${SHA_IMAGE}" "${LOCAL_IMAGE}"

      - name: Verify image runtime user and command
        shell: bash
        run: |
          set -euo pipefail

          user="$(
            docker image inspect \
              --format '{{.Config.User}}' \
              "${LOCAL_IMAGE}"
          )"

          test "${user}" = "10001:10001"

          cmd="$(
            docker image inspect \
              --format '{{json .Config.Cmd}}' \
              "${LOCAL_IMAGE}"
          )"

          echo "Image user: ${user}"
          echo "Image cmd: ${cmd}"

          echo "${cmd}" | grep -F 'worker:source'

      - name: Run non-root isolation runtime smoke
        run: |
          docker run \
            --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m \
            --tmpfs /home/appforge:rw,nosuid,nodev,uid=10001,gid=10001,mode=0700,size=256m \
            --tmpfs /app/work:rw,nosuid,nodev,uid=10001,gid=10001,mode=0750,size=512m \
            --tmpfs /app/outputs:rw,nosuid,nodev,uid=10001,gid=10001,mode=0750,size=512m \
            --tmpfs /app/shared-inputs:rw,nosuid,nodev,uid=10001,gid=10001,mode=0750,size=128m \
            --tmpfs /app/user-cache/10001:rw,nosuid,nodev,uid=10001,gid=10001,mode=0700,size=1024m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 256 \
            --memory 2g \
            --cpus 2 \
            --entrypoint /bin/sh \
            "${LOCAL_IMAGE}" \
            /app/scripts/source-worker-runtime-smoke.sh

      - name: Promote verified source Worker image
        shell: bash
        run: |
          set -euo pipefail

          SHA_IMAGE="${IMAGE_NAME}:${{ steps.image-tag.outputs.sha_tag }}"
          LATEST_IMAGE="${IMAGE_NAME}:latest"

          SHA_ID="$(
            docker image inspect               --format '{{.Id}}'               "${SHA_IMAGE}"
          )"

          LOCAL_ID="$(
            docker image inspect               --format '{{.Id}}'               "${LOCAL_IMAGE}"
          )"

          test "${SHA_ID}" = "${LOCAL_ID}"

          docker tag             "${SHA_IMAGE}"             "${LATEST_IMAGE}"

          LATEST_ID="$(
            docker image inspect               --format '{{.Id}}'               "${LATEST_IMAGE}"
          )"

          test "${SHA_ID}" = "${LATEST_ID}"

          echo "Promoting verified candidate: ${SHA_ID}"

          docker push "${LATEST_IMAGE}"
