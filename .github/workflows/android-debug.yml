name: AppForge Android Debug

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/android-debug.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore CI debug signing key
        shell: bash
        env:
          APPFORGE_DEBUG_KEYSTORE_B64: ${{ secrets.APPFORGE_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail

          if [ -z "$APPFORGE_DEBUG_KEYSTORE_B64" ]; then
            echo "APPFORGE_DEBUG_KEYSTORE_B64 is missing."
            exit 1
          fi

          printf '%s' "$APPFORGE_DEBUG_KEYSTORE_B64" \
            | base64 --decode \
            > "$RUNNER_TEMP/appforge-debug.p12"

          chmod 600 "$RUNNER_TEMP/appforge-debug.p12"

          test -s "$RUNNER_TEMP/appforge-debug.p12"

      - name: Verify CI signing key
        shell: bash
        env:
          APPFORGE_DEBUG_STORE_PASSWORD: ${{ secrets.APPFORGE_DEBUG_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          keytool -list \
            -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/appforge-debug.p12" \
            -storepass "$APPFORGE_DEBUG_STORE_PASSWORD" \
            -alias appforge-debug \
            > /dev/null

          echo "AppForge CI signing key verified."

      - name: Build debug APK
        env:
          APPFORGE_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/appforge-debug.p12
          APPFORGE_DEBUG_STORE_PASSWORD: ${{ secrets.APPFORGE_DEBUG_STORE_PASSWORD }}
          APPFORGE_DEBUG_KEY_ALIAS: appforge-debug
          APPFORGE_DEBUG_KEY_PASSWORD: ${{ secrets.APPFORGE_DEBUG_STORE_PASSWORD }}
        run: |
          gradle \
            -p android-app \
            :app:signingReport \
            :app:assembleDebug \
            --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AppForge-Studio-v3.0-debug
          path: android-app/app/build/outputs/apk/debug/*.apk
