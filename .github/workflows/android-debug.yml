name: AppForge Android Debug

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/android-debug.yml"
      - ".github/scripts/railway_production.py"
      - ".github/workflows/production-automation.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Restore AppForge Firebase config
        shell: bash
        env:
          APPFORGE_FIREBASE_GOOGLE_SERVICES_B64: ${{ secrets.APPFORGE_FIREBASE_GOOGLE_SERVICES_B64 }}
        run: |
          set -euo pipefail

          if [ -n "$APPFORGE_FIREBASE_GOOGLE_SERVICES_B64" ]; then
            printf '%s' "$APPFORGE_FIREBASE_GOOGLE_SERVICES_B64"               | base64 --decode               > android-app/app/google-services.json

            python3 -m json.tool               android-app/app/google-services.json               >/dev/null

            echo "AppForge Studio Firebase config restored."
          else
            echo "APPFORGE_FIREBASE_GOOGLE_SERVICES_B64 tanımlı değil; Studio FCM bu build'de pasif."
          fi

      - name: Restore CI debug signing key
        shell: bash
        env:
          APPFORGE_DEBUG_KEYSTORE_B64: ${{ secrets.APPFORGE_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail

          if [ -z "$APPFORGE_DEBUG_KEYSTORE_B64" ]; then
            echo "APPFORGE_DEBUG_KEYSTORE_B64 is missing."
            exit 1
          fi

          printf '%s' "$APPFORGE_DEBUG_KEYSTORE_B64" \
            | base64 --decode \
            > "$RUNNER_TEMP/appforge-debug.p12"

          chmod 600 "$RUNNER_TEMP/appforge-debug.p12"
          test -s "$RUNNER_TEMP/appforge-debug.p12"

      - name: Verify CI signing key
        shell: bash
        env:
          APPFORGE_DEBUG_STORE_PASSWORD: ${{ secrets.APPFORGE_DEBUG_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          keytool -list \
            -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/appforge-debug.p12" \
            -storepass "$APPFORGE_DEBUG_STORE_PASSWORD" \
            -alias appforge-debug \
            > /dev/null

          echo "AppForge CI signing key verified."

      - name: Build debug APK
        env:
          APPFORGE_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/appforge-debug.p12
          APPFORGE_DEBUG_STORE_PASSWORD: ${{ secrets.APPFORGE_DEBUG_STORE_PASSWORD }}
          APPFORGE_DEBUG_KEY_ALIAS: appforge-debug
          APPFORGE_DEBUG_KEY_PASSWORD: ${{ secrets.APPFORGE_DEBUG_STORE_PASSWORD }}
          APPFORGE_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.APPFORGE_GITHUB_OAUTH_CLIENT_ID }}
          APPFORGE_RAILWAY_OAUTH_CLIENT_ID: ${{ secrets.APPFORGE_RAILWAY_OAUTH_CLIENT_ID }}
        run: |
          gradle \
            -p android-app \
            :app:testDebugUnitTest \
            :app:signingReport \
            :app:assembleDebug \
            --stacktrace

      - name: Prepare latest APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find android-app/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"

          test -n "$APK"
          test -s "$APK"

          cp "$APK" AppForgeStudio-latest.apk

          echo "APK hazır:"
          ls -lh AppForgeStudio-latest.apk

      - name: Verify APK package SDK and signature
        shell: bash
        run: |
          set -euo pipefail

          APK="AppForgeStudio-latest.apk"

          AAPT="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name aapt \
              | sort -V \
              | tail -n 1
          )"

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner \
              | sort -V \
              | tail -n 1
          )"

          test -x "$AAPT"
          test -x "$APKSIGNER"

          "$APKSIGNER" \
            verify \
            --verbose \
            --print-certs \
            "$APK"

          BADGING="$(
            "$AAPT" \
              dump badging \
              "$APK"
          )"

          echo "$BADGING" \
            | grep -F \
              "package: name='com.appforge.studio'"

          echo "$BADGING" \
            | grep -F \
              "sdkVersion:'26'"

          echo "$BADGING" \
            | grep -F \
              "targetSdkVersion:'37'"

          echo "APK metadata + signature verified."

      - name: Publish latest APK release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view appforge-studio-latest >/dev/null 2>&1; then
            gh release upload \
              appforge-studio-latest \
              AppForgeStudio-latest.apk \
              --clobber
          else
            gh release create \
              appforge-studio-latest \
              AppForgeStudio-latest.apk \
              --title "AppForge Studio Latest" \
              --notes "Latest signed AppForge Studio APK." \
              --target "$GITHUB_SHA"
          fi

          echo "APK GitHub Release'e yüklendi."
