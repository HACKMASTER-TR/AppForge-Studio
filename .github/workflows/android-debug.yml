name: AppForge Android Debug

on:
  workflow_dispatch:
    inputs:
      pro_recovery_test:
        description: "Build isolated Pro recovery test APK"
        type: boolean
        required: false
        default: false
      pro_second_device:
        description: "Build isolated normal Pro staging APK for second device"
        type: boolean
        required: false
        default: false
      pro_process_death_test:
        description: "Build isolated actual Android process-death test APK"
        type: boolean
        required: false
        default: false
      integration_debug_version_code:
        description: "B05+V3 isolated debug upgrade APK only; enter 533 or leave blank"
        type: string
        required: false
        default: ""
      publish_latest_release:
        description: "Explicit approval required; may trigger Play Production"
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main
    paths:
      - "android-app/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Set up Node.js 22 for wrapper tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify workflow command dependencies
        shell: bash
        run: |
          set -euo pipefail
          for tool in git find sort tail ln python3 java javac keytool gradle node base64 chmod cp head ls grep gh; do
            if ! command -v "$tool" > /dev/null; then
              echo "Missing workflow command: $tool"
              exit 1
            fi
          done
          node --version
          python3 --version

      - name: Verify V9 offline distribution security
        shell: bash
        run: |
          set -euo pipefail
          for pattern in test_v9_package_mirror.py test_v9_r2_plan.py test_v9_signed_closure.py test_v9_signed_index_seed.py test_v9_resumable_deb.py test_v9_phase3d_audit.py test_v9_phase3e_verify.py test_v9_phase3f_policy.py; do
            log=$(mktemp)
            python3 -m unittest discover -s quality/tests -p "$pattern" -v 2>&1 | tee "$log"
            if grep -Eq 'skipped=[1-9]|\.\.\. skipped ' "$log"; then
              echo "Skipped distribution security tests are not permitted"
              exit 1
            fi
            rm -f "$log"
          done
          node --test cloudflare/package-distribution/worker.test.mjs

      - name: Install deterministic Android native toolchain
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(
            find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              | sort -V \
              | tail -n 1
          )"

          test -x "$SDKMANAGER"

          "$SDKMANAGER" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          test -d "$ANDROID_HOME/cmake/3.22.1"

          echo "Android native toolchain verified: NDK 28.2.13676358 / CMake 3.22.1"

      - name: Compile generated Android wrappers
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          # Android 17 platform package uses the 37.0 identifier.
          "$SDKMANAGER" --channel=3 "platforms;android-37.0"
          test -s "$ANDROID_HOME/platforms/android-37.0/android.jar"

          # Keep AGP compileSdk 37 compatible with the SDK folder.
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -s "$ANDROID_HOME/platforms/android-37/android.jar"
          gradle -p android-app :html-apk-template:compileReleaseJavaWithJavac --no-daemon
          mapfile -t ZXING_JARS < <(find "$HOME/.gradle/caches/modules-2/files-2.1/com.google.zxing/core/3.5.3" -type f -name 'core-3.5.3.jar')
          test "${#ZXING_JARS[@]}" -eq 1
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          jars=list((Path.home()/'.gradle/caches/modules-2/files-2.1/com.android.billingclient/billing/9.1.0').glob('*/*.aar'))
          assert len(jars)==1
          with ZipFile(jars[0]) as archive:
              (Path(os.environ['RUNNER_TEMP'])/'appforge-billing.jar').write_bytes(archive.read('classes.jar'))
          PY
          mkdir -p "$RUNNER_TEMP/generated-wrapper-classes"
          javac --release 8 -Xlint:-options \
            -cp "$ANDROID_HOME/platforms/android-37.0/android.jar:${ZXING_JARS[0]}:$RUNNER_TEMP/appforge-billing.jar" \
            -d "$RUNNER_TEMP/generated-wrapper-classes" \
            android-app/app/src/main/assets/device-build/*.java \
            android-app/html-apk-template/src/main/java/com/appforge/htmlstub/*.java
          node --test quality/tests/html_document_bridge_runtime.test.js quality/tests/fast_html_v2_runtime.test.js quality/tests/fast_html_media_runtime.test.js quality/tests/fast_html_location_runtime.test.js quality/tests/fast_html_billing_runtime.test.js quality/tests/web_wrapper_config_contract.test.js

      - name: Restore CI debug signing key
        shell: bash
        env:
          APPFORGE_DEBUG_KEYSTORE_B64: ${{ secrets.APPFORGE_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail

          if [ -z "$APPFORGE_DEBUG_KEYSTORE_B64" ]; then
            echo "APPFORGE_DEBUG_KEYSTORE_B64 is missing."
            exit 1
          fi

          printf '%s' "$APPFORGE_DEBUG_KEYSTORE_B64" \
            | base64 --decode \
            > "$RUNNER_TEMP/appforge-debug.p12"

          chmod 600 "$RUNNER_TEMP/appforge-debug.p12"
          test -s "$RUNNER_TEMP/appforge-debug.p12"

      - name: Verify CI signing key
        shell: bash
        env:
          APPFORGE_DEBUG_STORE_PASSWORD: ${{ secrets.APPFORGE_DEBUG_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          keytool -list \
            -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/appforge-debug.p12" \
            -storepass "$APPFORGE_DEBUG_STORE_PASSWORD" \
            -alias appforge-debug \
            > /dev/null

          echo "AppForge CI signing key verified."

      - name: Build debug APK
        env:
          APPFORGE_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/appforge-debug.p12
          APPFORGE_DEBUG_STORE_PASSWORD: ${{ secrets.APPFORGE_DEBUG_STORE_PASSWORD }}
          APPFORGE_DEBUG_KEY_ALIAS: appforge-debug
          APPFORGE_DEBUG_KEY_PASSWORD: ${{ secrets.APPFORGE_DEBUG_STORE_PASSWORD }}
          APPFORGE_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.APPFORGE_GITHUB_OAUTH_CLIENT_ID }}
          APPFORGE_INTEGRATION_DEBUG_VERSION_CODE: ${{ inputs.integration_debug_version_code }}
        run: |
          EXTRA=()

          if [ "${{ inputs.pro_recovery_test }}" = "true" ] &&
             [ "${{ inputs.pro_second_device }}" = "true" ]; then
            echo "STOP: Incompatible Pro test modes"
            exit 1
          fi

          if [ "${{ inputs.pro_process_death_test }}" = "true" ]; then
            if [ "${{ inputs.pro_recovery_test }}" = "true" ] ||
               [ "${{ inputs.pro_second_device }}" = "true" ]; then
              echo "STOP: Process-death mode must be isolated"
              exit 1
            fi
          fi

          if [ "${{ inputs.pro_recovery_test }}" = "true" ]; then
            EXTRA=(-PappforgeProRecoveryTest=true)
          elif [ "${{ inputs.pro_second_device }}" = "true" ]; then
            EXTRA=(-PappforgeProSecondDevice=true)
          elif [ "${{ inputs.pro_process_death_test }}" = "true" ]; then
            EXTRA=(-PappforgeProProcessDeathTest=true)
          fi

          if [ -n "$APPFORGE_INTEGRATION_DEBUG_VERSION_CODE" ]; then
            if [ "$APPFORGE_INTEGRATION_DEBUG_VERSION_CODE" != "533" ] ||
               [ "$GITHUB_REF" != "refs/heads/feat/b05-pty-v3-integration-20261011" ]; then
              echo "STOP: Debug upgrade 533 is permitted only on the integration branch."
              exit 1
            fi
            if [ "${{ inputs.pro_recovery_test }}" = "true" ] ||
               [ "${{ inputs.pro_second_device }}" = "true" ] ||
               [ "${{ inputs.pro_process_death_test }}" = "true" ]; then
              echo "STOP: Debug upgrade 533 cannot be combined with isolated Pro modes."
              exit 1
            fi
            EXTRA+=("-PappforgeIntegrationDebugVersionCode=533")
          fi

          gradle \
            -p android-app \
            "${EXTRA[@]}" \
            :app:testDebugUnitTest \
            :app:signingReport \
            :app:assembleDebug \
            --stacktrace

      - name: Prepare latest APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find android-app/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"

          test -n "$APK"
          test -s "$APK"

          cp "$APK" AppForgeStudio-latest.apk

          echo "APK hazır:"
          ls -lh AppForgeStudio-latest.apk

      - name: Verify APK package SDK and signature
        shell: bash
        env:
          APPFORGE_INTEGRATION_DEBUG_VERSION_CODE: ${{ inputs.integration_debug_version_code }}
        run: |
          set -euo pipefail

          APK="AppForgeStudio-latest.apk"

          AAPT="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name aapt \
              | sort -V \
              | tail -n 1
          )"

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner \
              | sort -V \
              | tail -n 1
          )"

          test -x "$AAPT"
          test -x "$APKSIGNER"

          "$APKSIGNER" \
            verify \
            --verbose \
            --print-certs \
            "$APK"

          BADGING="$(
            "$AAPT" \
              dump badging \
              "$APK"
          )"

          PACKAGE="com.appforge.studio"
          if [ "${{ inputs.pro_recovery_test }}" = "true" ]; then
            PACKAGE="com.appforge.studio.prorecovery"
          elif [ "${{ inputs.pro_second_device }}" = "true" ]; then
            PACKAGE="com.appforge.studio.prodevice2"
          elif [ "${{ inputs.pro_process_death_test }}" = "true" ]; then
            PACKAGE="com.appforge.studio.prodeath"
          fi

          echo "$BADGING" \
            | grep -F \
              "package: name='$PACKAGE'"

          echo "$BADGING" \
            | grep -F \
              "sdkVersion:'26'"

          echo "$BADGING" \
            | grep -F \
              "targetSdkVersion:'37'"

          if [ "$APPFORGE_INTEGRATION_DEBUG_VERSION_CODE" = "533" ]; then
            echo "$BADGING" | grep -F "versionCode='533'"
            echo "$BADGING" | grep -F "versionName='5.0.33-b05-v3-debug'"
          fi

          echo "APK metadata + signature verified."

      - name: Upload debug APK artifact
        if: ${{ !inputs.pro_recovery_test && !inputs.pro_second_device && !inputs.pro_process_death_test }}
        uses: actions/upload-artifact@v5
        with:
          name: AppForgeStudio-debug-${{ github.sha }}
          path: AppForgeStudio-latest.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload isolated Pro recovery test APK
        if: ${{ inputs.pro_recovery_test }}
        uses: actions/upload-artifact@v5
        with:
          name: AppForgeStudio-Pro-Recovery-Test-${{ github.sha }}
          path: AppForgeStudio-latest.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload isolated second-device APK
        if: ${{ inputs.pro_second_device && !inputs.pro_recovery_test }}
        uses: actions/upload-artifact@v5
        with:
          name: AppForgeStudio-Pro-Device2-${{ github.sha }}
          path: AppForgeStudio-latest.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload isolated process-death test APK
        if: ${{ inputs.pro_process_death_test && !inputs.pro_recovery_test && !inputs.pro_second_device }}
        uses: actions/upload-artifact@v5
        with:
          name: AppForgeStudio-Pro-Process-Death-${{ github.sha }}
          path: AppForgeStudio-latest.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish latest APK release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_latest_release == true && github.ref == 'refs/heads/main' && !inputs.pro_recovery_test && !inputs.pro_second_device && !inputs.pro_process_death_test
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view appforge-studio-latest >/dev/null 2>&1; then
            gh release upload \
              appforge-studio-latest \
              AppForgeStudio-latest.apk \
              --clobber
          else
            gh release create \
              appforge-studio-latest \
              AppForgeStudio-latest.apk \
              --title "AppForge Studio Latest" \
              --notes "Latest signed AppForge Studio APK." \
              --target "$GITHUB_SHA"
          fi

          echo "APK GitHub Release'e yüklendi."
