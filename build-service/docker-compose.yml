services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: appforge
      POSTGRES_USER: appforge
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - appforge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appforge -d appforge"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - appforge_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: appforge
      MINIO_ROOT_PASSWORD: appforge_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - appforge_minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set appforge http://minio:9000 appforge appforge_dev_secret; do sleep 2; done;
      mc mb --ignore-existing appforge/appforge
      "

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://appforge:change_me@postgres:5432/appforge
      JWT_SECRET: replace-with-a-long-random-secret-at-least-32-chars
      RUN_INLINE_WORKER: "false"
      REDIS_URL: redis://redis:6379
      REDIS_REQUIRED: "true"
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: appforge
      S3_ACCESS_KEY_ID: appforge
      S3_SECRET_ACCESS_KEY: appforge_dev_secret
      S3_FORCE_PATH_STYLE: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_REQUIRED: "true"
      EMAIL_FROM: "AppForge <no-reply@appforge.local>"
      SHARED_INPUT_ROOT: /shared-inputs
      OUTPUT_ROOT: /outputs
      WORK_ROOT: /work
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - appforge_inputs:/shared-inputs
      - appforge_outputs:/outputs
      - appforge_work:/work

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        ANDROID_SDK_LICENSE_ACCEPTED: ${ANDROID_SDK_LICENSE_ACCEPTED:-false}
        ANDROID_CMDLINE_TOOLS_VERSION: "15859902"
        ANDROID_CMDLINE_TOOLS_SHA256: "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583"
        GRADLE_VERSION: "9.3.1"
    environment:
      DATABASE_URL: postgresql://appforge:change_me@postgres:5432/appforge
      JWT_SECRET: replace-with-a-long-random-secret-at-least-32-chars
      REDIS_URL: redis://redis:6379
      REDIS_REQUIRED: "true"
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: appforge
      S3_ACCESS_KEY_ID: appforge
      S3_SECRET_ACCESS_KEY: appforge_dev_secret
      S3_FORCE_PATH_STYLE: "true"
      SHARED_INPUT_ROOT: /shared-inputs
      OUTPUT_ROOT: /outputs
      WORK_ROOT: /work
      GRADLE_CACHE_ROOT: /gradle-cache
      GRADLE_BIN: gradle
      WORKER_STRICT_TOOLCHAIN: "true"
      EXPECTED_ANDROID_API: "37"
      EXPECTED_BUILD_TOOLS: "36.0.0"
      EXPECTED_GRADLE: "9.3.1"
      EXPECTED_JDK_MAJOR: "17"
      # One focused build gets the worker's RAM/CPU; this avoids two Gradle JVMs
      # competing and makes the build the user is watching finish sooner.
      BUILD_CONCURRENCY: "1"
      GRADLE_PERFORMANCE_PROFILE: throughput
      WORKER_CAPABILITIES: android-api-37,build-tools-36.0.0,java-17,gradle
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - appforge_inputs:/shared-inputs
      - appforge_outputs:/outputs
      - appforge_work:/work
      - appforge_gradle_cache:/gradle-cache

volumes:
  appforge_pg:
  appforge_redis:
  appforge_inputs:
  appforge_outputs:
  appforge_work:
  appforge_gradle_cache:
  appforge_minio:
