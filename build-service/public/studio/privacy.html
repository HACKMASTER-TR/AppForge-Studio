<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>AppForge Studio • Gizlilik Politikası</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f4f7ff;background:#060711}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 15% 0,#123750 0,transparent 32%),radial-gradient(circle at 90% 12%,#40233f 0,transparent 30%),#060711}
main{width:min(900px,calc(100% - 28px));margin:auto;padding:40px 0 72px}
.hero,.card{border:1px solid #27314a;background:rgba(15,19,35,.94);border-radius:26px}
.hero{padding:28px;margin-bottom:16px}
.card{padding:22px;margin-top:14px}
.brand{color:#63d9ff;font-weight:900;letter-spacing:.13em;font-size:12px}
h1{font-size:clamp(30px,7vw,48px);margin:8px 0}
h2{font-size:20px;margin:0 0 12px}
p{color:#b4bdd1;line-height:1.7}
.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
button{border:1px solid #3a455f;background:#151b2e;color:#edf2ff;padding:9px 13px;border-radius:999px}
button.active{background:#63d9ff;color:#061018;border-color:#63d9ff}
a{color:#63d9ff}
.small{font-size:12px;color:#7f8aa3}
</style>
</head>
<body>
<main>
<section class="hero">
<div class="brand">APPFORGE • STUDIO</div>
<h1 id="title"></h1>
<p id="lead"></p>
<div class="buttons">
<button data-lang="tr">Türkçe</button>
<button data-lang="en">English</button>
<button data-lang="de">Deutsch</button>
<button data-lang="ar">العربية</button>
</div>
<p class="small" id="date"></p>
</section>

<section class="card"><h2 id="deviceTitle"></h2><p id="deviceBody"></p></section>
<section class="card"><h2 id="buildTitle"></h2><p id="buildBody"></p></section>
<section class="card"><h2 id="thirdTitle"></h2><p id="thirdBody"></p></section>
<section class="card"><h2 id="appsTitle"></h2><p id="appsBody"></p></section>
<section class="card"><h2 id="supportTitle"></h2><p><a href="https://github.com/HACKMASTER-TR/AppForge-Studio">AppForge Studio GitHub</a></p></section>
</main>

<script>
const T={
tr:{
title:"Gizlilik Politikası",
lead:"Bu sayfa AppForge Studio'nun kendi veri işleme yaklaşımını açıklar.",
date:"Son güncelleme: 31 Ağustos 2026",
deviceTitle:"Cihazdaki proje verileri",
deviceBody:"Proje ayarları ve yerel çalışma verileri mümkün olduğunda cihazınızda tutulur.",
buildTitle:"Sunucu üzerinden derleme",
buildBody:"Sunucu derlemesi istediğinizde gerekli kaynak dosyaları ve build metadatası AppForge Build Service'e gönderilir. Derleme çıktıları indirme için yapılandırılmış nesne depolama servisinde tutulabilir.",
thirdTitle:"Üçüncü taraf servisleri",
thirdBody:"Firebase, Analytics, Crashlytics, Cloud Messaging, AdMob, Google Play Billing ve benzeri servisler yalnız ilgili özelliği etkinleştirip yapılandırdığınızda kullanılır. Bu servislerin kendi politikaları da geçerlidir.",
appsTitle:"AppForge ile oluşturulan uygulamalar",
appsBody:"Her uygulamanın veri kullanımı farklı olabilir. Yayınladığınız uygulama için gerçek davranışına uygun ayrı bir gizlilik politikası ve mağaza Data Safety beyanı hazırlamanız gerekir.",
supportTitle:"Proje ve destek"
},
en:{
title:"Privacy Policy",
lead:"This page explains AppForge Studio's own data-processing approach.",
date:"Last updated: August 31, 2026",
deviceTitle:"Project data on your device",
deviceBody:"Project settings and local workspace data are kept on your device where possible.",
buildTitle:"Server-backed builds",
buildBody:"When you request a server build, required source files and build metadata are sent to the AppForge Build Service. Build artifacts may be stored in the configured object-storage service so they can be downloaded.",
thirdTitle:"Third-party services",
thirdBody:"Firebase, Analytics, Crashlytics, Cloud Messaging, AdMob, Google Play Billing, and similar services are used only when you enable and configure the corresponding feature. Their own policies also apply.",
appsTitle:"Apps created with AppForge",
appsBody:"Every app can have different data practices. For an app you publish, you must provide a separate privacy policy and store Data Safety declarations matching its actual behavior.",
supportTitle:"Project and support"
},
de:{
title:"Datenschutzerklärung",
lead:"Diese Seite beschreibt den Umgang von AppForge Studio mit Daten.",
date:"Letzte Aktualisierung: 31. August 2026",
deviceTitle:"Projektdaten auf deinem Gerät",
deviceBody:"Projekteinstellungen und lokale Arbeitsdaten werden nach Möglichkeit auf deinem Gerät gespeichert.",
buildTitle:"Servergestützte Builds",
buildBody:"Bei einem Server-Build werden die benötigten Quelldateien und Build-Metadaten an den AppForge Build Service übertragen. Build-Artefakte können im konfigurierten Objektspeicher gespeichert werden.",
thirdTitle:"Drittanbieterdienste",
thirdBody:"Firebase, Analytics, Crashlytics, Cloud Messaging, AdMob, Google Play Billing und ähnliche Dienste werden nur verwendet, wenn die entsprechende Funktion aktiviert und konfiguriert wird. Deren Richtlinien gelten zusätzlich.",
appsTitle:"Mit AppForge erstellte Apps",
appsBody:"Jede App kann andere Datenpraktiken haben. Für veröffentlichte Apps musst du eine passende Datenschutzerklärung und Data-Safety-Angaben gemäß dem tatsächlichen Verhalten bereitstellen.",
supportTitle:"Projekt und Support"
},
ar:{
title:"سياسة الخصوصية",
lead:"توضح هذه الصفحة طريقة تعامل AppForge Studio نفسه مع البيانات.",
date:"آخر تحديث: 31 أغسطس 2026",
deviceTitle:"بيانات المشروع على جهازك",
deviceBody:"يتم الاحتفاظ بإعدادات المشروع وبيانات مساحة العمل محليًا على جهازك كلما كان ذلك ممكنًا.",
buildTitle:"البناء عبر الخادم",
buildBody:"عند طلب بناء عبر الخادم يتم إرسال ملفات المصدر وبيانات البناء المطلوبة إلى AppForge Build Service. وقد يتم تخزين ملفات البناء في خدمة التخزين المهيأة.",
thirdTitle:"خدمات الأطراف الثالثة",
thirdBody:"لا يتم استخدام Firebase وAnalytics وCrashlytics وCloud Messaging وAdMob وGoogle Play Billing والخدمات المشابهة إلا عند تفعيل وإعداد الميزة المقابلة. كما تنطبق سياسات تلك الخدمات.",
appsTitle:"التطبيقات المنشأة باستخدام AppForge",
appsBody:"قد تكون لكل تطبيق ممارسات بيانات مختلفة. عند نشر تطبيق يجب توفير سياسة خصوصية منفصلة وإقرارات Data Safety متوافقة مع السلوك الفعلي.",
supportTitle:"المشروع والدعم"
}
};

function apply(lang){
 const x=T[lang]||T.en;
 document.documentElement.lang=lang;
 document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 Object.entries(x).forEach(([k,v])=>{
   const el=document.getElementById(k);
   if(el) el.textContent=v;
 });
 document.querySelectorAll("[data-lang]").forEach(b=>{
   b.classList.toggle("active",b.dataset.lang===lang);
 });
 localStorage.setItem("appforge_privacy_lang",lang);
}
const stored=localStorage.getItem("appforge_privacy_lang");
const browser=(navigator.language||"en").slice(0,2).toLowerCase();
apply(stored||(["tr","en","de","ar"].includes(browser)?browser:"en"));
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>apply(b.dataset.lang));
</script>
</body>
</html>
